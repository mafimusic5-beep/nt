apiVersion: v1
kind: ConfigMap
metadata:
  name: emery-recovery-agent-config
data:
  RECOVERY_PROBE_INTERVAL_SECONDS: "15"
  RECOVERY_MAX_PARALLEL_NODES: "32"
  RECOVERY_PROBE_TIMEOUT_SECONDS: "3"
  RECOVERY_FAILURE_THRESHOLD: "3"
  RECOVERY_RESTART_GRACE_SECONDS: "10"
  RECOVERY_REBOOT_GRACE_SECONDS: "45"
  RECOVERY_REBOOT_PROBE_INTERVAL_SECONDS: "10"
  RECOVERY_REBOOT_PROBE_ATTEMPTS: "12"
  RECOVERY_LOCK_SECONDS: "600"
  RECOVERY_COOLDOWN_SECONDS: "300"
  RECOVERY_SSH_USER: "root"
  RECOVERY_SSH_PRIVATE_KEY_PATH: "/etc/emery/recovery-ssh/id_ed25519"
  RECOVERY_SSH_CONNECT_TIMEOUT_SECONDS: "10"
  RECOVERY_SSH_KNOWN_HOSTS_PATH: "/etc/emery/ssh/known_hosts"
  RECOVERY_ALLOW_UNKNOWN_HOST_KEYS: "false"
  RECOVERY_HEARTBEAT_FILE: "/var/run/emery/recovery-agent.heartbeat"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emery-recovery-agent
  labels:
    app.kubernetes.io/name: emery-recovery-agent
    app.kubernetes.io/part-of: emery-vpn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: emery-recovery-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emery-recovery-agent
        app.kubernetes.io/part-of: emery-vpn
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: recovery-agent
          # Build this from backend/Dockerfile and pin an immutable release tag.
          image: YOUR_REGISTRY/emery-vpn-orchestrator-backend:VERSION
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.backend.recovery_agent"]
          envFrom:
            - configMapRef:
                name: emery-recovery-agent-config
            # Must contain the same DB_URL as the backend. It may also contain
            # RECOVERY_PROVIDER_REBOOT_SCRIPT and other normal backend settings.
            - secretRef:
                name: emery-vpn-backend-env
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import os,time;
                  path=os.environ['RECOVERY_HEARTBEAT_FILE'];
                  assert time.time()-os.path.getmtime(path) < 90
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: heartbeat
              mountPath: /var/run/emery
            - name: node-known-hosts
              mountPath: /etc/emery/ssh
              readOnly: true
            - name: recovery-ssh-key
              mountPath: /etc/emery/recovery-ssh
              readOnly: true
      volumes:
        - name: heartbeat
          emptyDir: {}
        - name: node-known-hosts
          secret:
            secretName: emery-vpn-node-known-hosts
            optional: true
            items:
              - key: known_hosts
                path: known_hosts
        - name: recovery-ssh-key
          secret:
            secretName: emery-vpn-recovery-ssh
            optional: true
            # Group-readable for the pod fsGroup; still unavailable outside
            # this Secret volume.
            defaultMode: 0440
            items:
              - key: id_ed25519
                path: id_ed25519
