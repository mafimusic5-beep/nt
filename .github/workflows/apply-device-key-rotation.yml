name: Apply device key rotation fix

on:
  push:
    branches:
      - fix/rkn-blacklist-full-tunnel
    paths:
      - .github/workflows/apply-device-key-rotation.yml
  pull_request:
    branches:
      - fix/activation-connectivity-latest-ui
    paths:
      - .github/workflows/apply-device-key-rotation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rkn-blacklist-full-tunnel
          fetch-depth: 0
      - name: Allow one active key per stable device ID
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('orchestrator/device_auth.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"(?m)^(?P<i>\s*)stored_fingerprint = str\(existing\['public_key_fingerprint'\] or ''\)\n"
              r"(?P=i)if stored_fingerprint and stored_fingerprint != fingerprint:\n"
              r"(?P=i)    raise DeviceAuthError\('device_signature_invalid', 409\)\n"
          )
          replacement = (
              "\\g<i>stored_fingerprint = str(existing['public_key_fingerprint'] or '')\n"
              "\\g<i># Reinstall keeps the stable Android ID but Android removes the old\n"
              "\\g<i># Keystore entry. Rotate the key in-place for that same device row;\n"
              "\\g<i># the UPDATE below replaces the fingerprint, so the previous key\n"
              "\\g<i># immediately stops authenticating and no extra tariff slot is used.\n"
          )
          updated, count = pattern.subn(replacement, text, count=1)
          if count == 0:
              if 'Rotate the key in-place for that same device row' in text:
                  print('Patch already applied')
              else:
                  raise SystemExit('Expected key-binding block not found')
          else:
              path.write_text(updated, encoding='utf-8')
      - name: Compile patched backend
        run: python -m compileall -q orchestrator
      - name: Commit source patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orchestrator/device_auth.py
          git commit -m 'Rotate device key after reinstall without using a new slot'
          git push origin HEAD:fix/rkn-blacklist-full-tunnel
