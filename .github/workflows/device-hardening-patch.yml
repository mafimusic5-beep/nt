name: Apply device hardening patch

on:
  push:
    branches:
      - security/device-reinstall-hardening
    paths:
      - .github/workflows/device-hardening-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/device-reinstall-hardening
          fetch-depth: 0
      - name: Apply deterministic source edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          version_needle = '        buildConfigField("int", "SKRYON_VERSION_CODE", appVersionCode.toString())\n'
          version_insert = version_needle + '''\n        val playIntegrityCloudProjectNumber =\n            (project.findProperty("SKRYON_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER") as String?)\n                ?.trim()\n                ?.toLongOrNull()\n                ?: System.getenv("SKRYON_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER")\n                    ?.trim()\n                    ?.toLongOrNull()\n                ?: 0L\n        buildConfigField(\n            "long",\n            "SKRYON_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER",\n            "${playIntegrityCloudProjectNumber}L",\n        )\n'''
          if version_needle not in text:
              raise SystemExit('buildConfig insertion point missing')
          text = text.replace(version_needle, version_insert, 1)
          dep_needle = '    implementation(libs.okhttp)\n'
          dep_insert = dep_needle + '    implementation("com.google.android.play:integrity:1.6.0")\n'
          if dep_needle not in text:
              raise SystemExit('dependency insertion point missing')
          text = text.replace(dep_needle, dep_insert, 1)
          gradle.write_text(text, encoding='utf-8')

          activation = Path('app/src/main/java/com/v2ray/ang/ui/premium/SkryonActivationClient.kt')
          text = activation.read_text(encoding='utf-8')
          import_needle = 'import com.v2ray.ang.security.EmeryDeviceIdentity\n'
          if import_needle not in text:
              raise SystemExit('recovery import insertion point missing')
          text = text.replace(
              import_needle,
              import_needle + 'import com.v2ray.ang.security.SkryonDeviceRecoveryClient\n',
              1,
          )
          helper_marker = 'internal suspend fun validateSkryonCode(\n'
          helper = '''private suspend fun ensureSecureDeviceRecovery(\n    context: Context,\n    submittedCode: String,\n): SkryonActivationResult? {\n    val recovery = SkryonDeviceRecoveryClient.recoverIfNeeded(context, submittedCode)\n    if (recovery.isSuccess) return null\n    val reason = recovery.exceptionOrNull()?.message.orEmpty().ifBlank { "device_recovery_failed" }\n    return activationFailure(\n        error = activationReasonText(reason),\n        reason = reason,\n    )\n}\n\n'''
          if helper_marker not in text:
              raise SystemExit('validation function marker missing')
          text = text.replace(helper_marker, helper + helper_marker, 1)

          validation_needle = '''        val submittedCode = formattedCode.ifBlank { code.trim() }\n        val validationPath = "/api/activate/validate"\n'''
          validation_insert = '''        val submittedCode = formattedCode.ifBlank { code.trim() }\n        ensureSecureDeviceRecovery(context, submittedCode)?.let { return@withContext it }\n        val validationPath = "/api/activate/validate"\n'''
          if validation_needle not in text:
              raise SystemExit('validation recovery insertion point missing')
          text = text.replace(validation_needle, validation_insert, 1)

          activation_needle = '''        val submittedCode = formattedCode.ifBlank { code.trim() }\n        val activationPath = "/api/activate"\n'''
          activation_insert = '''        val submittedCode = formattedCode.ifBlank { code.trim() }\n        ensureSecureDeviceRecovery(context, submittedCode)?.let { return@withContext it }\n        val activationPath = "/api/activate"\n'''
          if activation_needle not in text:
              raise SystemExit('activation recovery insertion point missing')
          text = text.replace(activation_needle, activation_insert, 1)

          old_message = '''        "device_key_rotation_requires_reset" ->\n            "Ключ этого устройства уже зарегистрирован. После переустановки обратитесь в поддержку для безопасного сброса"\n'''
          new_message = '''        "device_key_rotation_requires_reset" -> "Требуется безопасное восстановление этого устройства"\n        "play_integrity_not_configured", "device_recovery_unavailable" ->\n            "Безопасное восстановление временно недоступно. Попробуйте позже"\n        "play_integrity_failed", "play_integrity_decode_failed", "play_integrity_oauth_failed" ->\n            "Не удалось подтвердить подлинность приложения. Проверьте Google Play и попробуйте снова"\n        "play_integrity_app_unrecognized", "play_integrity_device_failed", "play_integrity_certificate_mismatch" ->\n            "Устройство или приложение не прошло проверку безопасности"\n        "device_recovery_challenge_expired", "device_recovery_challenge_invalid" ->\n            "Проверка устройства истекла. Повторите активацию"\n        "device_recovery_replay_detected", "device_recovery_key_mismatch", "device_recovery_conflict" ->\n            "Безопасное восстановление устройства отклонено"\n'''
          if old_message not in text:
              raise SystemExit('recovery message replacement point missing')
          text = text.replace(old_message, new_message, 1)
          activation.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/java/com/v2ray/ang/ui/premium/SkryonActivationClient.kt
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate integrity-gated reinstall recovery in Android'
          git push origin HEAD:security/device-reinstall-hardening
