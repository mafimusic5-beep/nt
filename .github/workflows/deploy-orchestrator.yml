name: Deploy orchestrator to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'emery vpn orchestrator/**'
      - 'orchestrator/**'
      - '.github/workflows/deploy-orchestrator.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Deploy on VPS
        env:
          # skryon.ru is proxied by Cloudflare; SSH must use the public origin directly.
          DEPLOY_HOST: 80.71.159.221
          DEPLOY_PORT: 22
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh \
            -4 \
            -p "$DEPLOY_PORT" \
            -i ~/.ssh/id_ed25519 \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o StrictHostKeyChecking=accept-new \
            "${VPS_USER:-root}@${DEPLOY_HOST}" <<'EOF'
          set -euo pipefail
          cd /opt/emery
          GIT_SSH_COMMAND="ssh -i /root/.ssh/emery_deploy_key -o IdentitiesOnly=yes" git fetch origin main
          GIT_SSH_COMMAND="ssh -i /root/.ssh/emery_deploy_key -o IdentitiesOnly=yes" git reset --hard origin/main
          cd /opt/emery-orchestrator
          source .venv/bin/activate
          pip install -r requirements.txt
          alembic upgrade head

          legacy_dir=/opt/emery/orchestrator
          if [[ -x "$legacy_dir/.venv/bin/python" ]]; then
            "$legacy_dir/.venv/bin/python" -m pip install -r "$legacy_dir/requirements.txt"
          fi

          systemctl restart emery-backend emery-bot
          systemctl is-active --quiet emery-backend
          systemctl is-active --quiet emery-bot

          legacy_units=()
          while IFS= read -r unit; do
            systemctl is-active --quiet "$unit" || continue
            working_dir="$(systemctl show "$unit" --property=WorkingDirectory --value 2>/dev/null || true)"
            exec_start="$(systemctl show "$unit" --property=ExecStart --value 2>/dev/null || true)"
            case "$unit|$working_dir|$exec_start" in
              *skryon*|*"/opt/emery/orchestrator"*|*"tg_admin.py"*|*"uvicorn api:app"*)
                legacy_units+=("$unit")
                ;;
            esac
          done < <(systemctl list-unit-files --type=service --no-legend --no-pager | awk '{print $1}')

          if ((${#legacy_units[@]})); then
            printf 'Restarting legacy Skryon services: %s\n' "${legacy_units[*]}"
            systemctl restart "${legacy_units[@]}"
            for unit in "${legacy_units[@]}"; do
              systemctl is-active --quiet "$unit"
            done
          else
            printf 'No legacy Skryon systemd service was found; emery-bot remains available.\n'
          fi
          EOF
