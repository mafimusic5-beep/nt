name: Deploy orchestrator to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'emery vpn orchestrator/**'
      - 'orchestrator/**'
      - '.github/workflows/deploy-orchestrator.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Deploy on VPS
        env:
          # Current primary VPS; skryon.ru is proxied and must not be used for SSH.
          DEPLOY_HOST: 31.70.76.155
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          deploy_host=""
          deploy_port=""
          seen_candidates=" "
          candidate_hosts=("$DEPLOY_HOST" "${VPS_HOST:-}" "82.146.49.10")
          candidate_ports=("${VPS_PORT:-}" 22 2022 2222 2200 22222 8022)
          for candidate_host in "${candidate_hosts[@]}"; do
            [[ -n "$candidate_host" ]] || continue
            candidate_host="${candidate_host#http://}"
            candidate_host="${candidate_host#https://}"
            candidate_host="${candidate_host%%/*}"
            candidate_host="${candidate_host%%:*}"
            for candidate_port in "${candidate_ports[@]}"; do
              [[ "$candidate_port" =~ ^[0-9]+$ ]] || continue
              candidate_key=" $candidate_host:$candidate_port "
              [[ "$seen_candidates" != *"$candidate_key"* ]] || continue
              seen_candidates+="$candidate_key"
              if ssh \
                -4 \
                -p "$candidate_port" \
                -i ~/.ssh/id_ed25519 \
                -o BatchMode=yes \
                -o ConnectTimeout=5 \
                -o StrictHostKeyChecking=accept-new \
                "${VPS_USER:-root}@${candidate_host}" true >/dev/null 2>&1; then
                deploy_host="$candidate_host"
                deploy_port="$candidate_port"
                break 2
              fi
            done
          done

          if [[ -z "$deploy_host" ]]; then
            echo '::error::No configured VPS SSH endpoint accepted the deploy key.'
            exit 1
          fi

          ssh \
            -4 \
            -p "$deploy_port" \
            -i ~/.ssh/id_ed25519 \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o StrictHostKeyChecking=accept-new \
            "${VPS_USER:-root}@${deploy_host}" <<'EOF'
          set -euo pipefail
          cd /opt/emery
          GIT_SSH_COMMAND="ssh -i /root/.ssh/emery_deploy_key -o IdentitiesOnly=yes" git fetch origin main
          GIT_SSH_COMMAND="ssh -i /root/.ssh/emery_deploy_key -o IdentitiesOnly=yes" git reset --hard origin/main
          cd /opt/emery-orchestrator
          source .venv/bin/activate
          pip install -r requirements.txt
          alembic upgrade head

          legacy_dir=/opt/emery/orchestrator
          if [[ -x "$legacy_dir/.venv/bin/python" ]]; then
            "$legacy_dir/.venv/bin/python" -m pip install -r "$legacy_dir/requirements.txt"
          fi

          systemctl restart emery-backend emery-bot
          systemctl is-active --quiet emery-backend
          systemctl is-active --quiet emery-bot

          legacy_units=()
          while IFS= read -r unit; do
            systemctl is-active --quiet "$unit" || continue
            working_dir="$(systemctl show "$unit" --property=WorkingDirectory --value 2>/dev/null || true)"
            exec_start="$(systemctl show "$unit" --property=ExecStart --value 2>/dev/null || true)"
            case "$unit|$working_dir|$exec_start" in
              *skryon*|*"/opt/emery/orchestrator"*|*"tg_admin.py"*|*"uvicorn api:app"*)
                legacy_units+=("$unit")
                ;;
            esac
          done < <(systemctl list-unit-files --type=service --no-legend --no-pager | awk '{print $1}')

          if ((${#legacy_units[@]})); then
            printf 'Restarting legacy Skryon services: %s\n' "${legacy_units[*]}"
            systemctl restart "${legacy_units[@]}"
            for unit in "${legacy_units[@]}"; do
              systemctl is-active --quiet "$unit"
            done
          else
            printf 'No legacy Skryon systemd service was found; emery-bot remains available.\n'
          fi
          EOF
