name: Deploy orchestrator to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'emery vpn orchestrator/**'
      - 'orchestrator/**'
      - '.github/workflows/deploy-orchestrator.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Export deploy public key
        run: |
          set -euo pipefail
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /tmp/vps_deploy_key.pub

      - name: Upload deploy public key
        uses: actions/upload-artifact@v4
        with:
          name: vps-deploy-public-key
          path: /tmp/vps_deploy_key.pub
          retention-days: 1

      - name: Inspect live VPS runtime
        env:
          DEPLOY_HOST: 31.70.76.155
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          deploy_host=""
          deploy_port=""
          seen_candidates=" "
          candidate_hosts=("$DEPLOY_HOST" "${VPS_HOST:-}" "82.146.49.10")
          candidate_ports=("${VPS_PORT:-}" 22 8443 2022 2222 2200 22222 8022)
          for candidate_host in "${candidate_hosts[@]}"; do
            [[ -n "$candidate_host" ]] || continue
            candidate_host="${candidate_host#http://}"
            candidate_host="${candidate_host#https://}"
            candidate_host="${candidate_host%%/*}"
            candidate_host="${candidate_host%%:*}"
            for candidate_port in "${candidate_ports[@]}"; do
              [[ "$candidate_port" =~ ^[0-9]+$ ]] || continue
              candidate_key=" $candidate_host:$candidate_port "
              [[ "$seen_candidates" != *"$candidate_key"* ]] || continue
              seen_candidates+="$candidate_key"
              if ssh \
                -4 \
                -p "$candidate_port" \
                -i ~/.ssh/id_ed25519 \
                -o BatchMode=yes \
                -o ConnectTimeout=5 \
                -o StrictHostKeyChecking=accept-new \
                "${VPS_USER:-root}@${candidate_host}" true >/dev/null 2>&1; then
                deploy_host="$candidate_host"
                deploy_port="$candidate_port"
                break 2
              fi
            done
          done

          if [[ -z "$deploy_host" ]]; then
            echo '::error::No configured VPS SSH endpoint accepted the deploy key.'
            exit 1
          fi

          printf 'Connected to %s:%s\n' "$deploy_host" "$deploy_port"
          ssh \
            -4 \
            -p "$deploy_port" \
            -i ~/.ssh/id_ed25519 \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o StrictHostKeyChecking=accept-new \
            "${VPS_USER:-root}@${deploy_host}" <<'EOF'
          set -euo pipefail

          if [[ ! -d /opt/nt/.git ]]; then
            printf 'Expected repository /opt/nt was not found.\n'
            find /opt -maxdepth 2 -mindepth 1 -printf '%y %p\n' 2>/dev/null | sort || true
            exit 64
          fi

          printf '%s\n' '--- repository ---'
          git -C /opt/nt rev-parse --abbrev-ref HEAD || true
          git -C /opt/nt rev-parse HEAD || true
          git -C /opt/nt status --short || true

          printf '%s\n' '--- service runtime (no environment values) ---'
          for unit in skryon-api.service skryon-bot.service; do
            printf '[%s]\n' "$unit"
            systemctl show "$unit" --no-pager \
              --property=LoadState \
              --property=ActiveState \
              --property=SubState \
              --property=User \
              --property=Group \
              --property=WorkingDirectory \
              --property=FragmentPath \
              --property=MainPID || true
            pid="$(systemctl show "$unit" --property=MainPID --value 2>/dev/null || true)"
            if [[ "$pid" =~ ^[1-9][0-9]*$ ]] && [[ -d "/proc/$pid" ]]; then
              printf 'Executable=%s\n' "$(readlink -f "/proc/$pid/exe" || true)"
              printf 'ProcessWorkingDirectory=%s\n' "$(readlink -f "/proc/$pid/cwd" || true)"
            fi
          done

          printf '%s\n' '--- related unit files ---'
          systemctl list-unit-files --type=service --no-legend --no-pager |
            awk 'tolower($1) ~ /(skryon|emery|xray|nginx|caddy|cloudflared|tunnel)/ {print $1, $2}' || true

          printf '%s\n' '--- runtime paths ---'
          for path in \
            /opt/nt/orchestrator/requirements.txt \
            /opt/nt/orchestrator/.env \
            /opt/nt/orchestrator/skryon.db \
            '/opt/nt/emery vpn orchestrator/requirements.txt' \
            '/opt/nt/emery vpn orchestrator/.env' \
            '/opt/nt/emery vpn orchestrator/alembic.ini' \
            '/opt/nt/emery vpn orchestrator/data/app.db'; do
            if [[ -e "$path" ]]; then
              stat -c '%F %a %U:%G %s %n' "$path"
            else
              printf 'missing %s\n' "$path"
            fi
          done

          printf '%s\n' '--- Python runtimes ---'
          find /opt/nt -maxdepth 6 \( -type f -o -type l \) \
            -path '*/bin/python*' -printf '%p -> %l\n' 2>/dev/null | sort | head -n 40 || true

          printf '%s\n' '--- local HTTP probes ---'
          for url in \
            http://127.0.0.1:8080/health \
            http://127.0.0.1:8080/api/config/sync \
            http://127.0.0.1:9330/api/v1/health; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "$url" || true)"
            printf '%s %s\n' "$code" "$url"
          done

          printf '%s\n' '--- listening sockets ---'
          ss -lntp || true

          # Intentional diagnostic stop. The next revision performs the in-place update.
          exit 65
          EOF
