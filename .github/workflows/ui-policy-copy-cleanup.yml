name: Apply regional policy copy cleanup

on:
  push:
    branches:
      - ui-policy-copy-cleanup-20260914
    paths:
      - '.github/workflows/ui-policy-copy-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ui-policy-copy-cleanup-20260914

      - name: Clean regional policy copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          premium = Path('app/src/main/java/com/v2ray/ang/ui/premium/PremiumActivity.kt')
          text = premium.read_text(encoding='utf-8')
          pattern = r'\n\s*if \(selectedMode == RegionalPolicyMode\.International\) \{.*?Я подтверждаю, что текущее VPN-подключение используется за пределами Российской Федерации\..*?\}\s*else if \(selectedMode == RegionalPolicyMode\.Russia\) \{.*?Ограничения применяются на сервере\. Списки не скачиваются на устройство\..*?\}\n'
          text, count = re.subn(pattern, '\n', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Onboarding conditional block count: {count}')
          old = 'text = "Если вы находитесь не в РФ, выберите «Международный». Позже политику можно переключить в разделе «Расширенные»."'
          new = 'text = "Режим можно изменить позже в разделе «Расширенные»."'
          if text.count(old) != 1:
              raise SystemExit(f'Onboarding hint count: {text.count(old)}')
          text = text.replace(old, new)
          old = 'text = "Сервис не определяет, не проверяет и не сохраняет ваше местоположение."'
          new = 'text = "Местоположение не определяется автоматически."'
          if text.count(old) != 1:
              raise SystemExit(f'Onboarding location copy count: {text.count(old)}')
          text = text.replace(old, new)
          premium.write_text(text, encoding='utf-8')

          vpn = Path('app/src/main/java/com/v2ray/ang/ui/premium/vpn/VpnMainScreen.kt')
          text = vpn.read_text(encoding='utf-8')
          pattern = r'\n\s*if \(selectedMode == RegionalPolicyMode\.Russia\) \{.*?Ограничения применяются на сервере\. Списки не скачиваются на устройство\..*?\}\n'
          text, count = re.subn(pattern, '\n', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Advanced server block count: {count}')
          old = 'text = "Сервис не определяет, не проверяет и не сохраняет ваше местоположение."'
          new = 'text = "Местоположение не определяется автоматически."'
          if text.count(old) != 1:
              raise SystemExit(f'Advanced location copy count: {text.count(old)}')
          text = text.replace(old, new)
          vpn.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- app/src/main/java/com/v2ray/ang/ui/premium/PremiumActivity.kt app/src/main/java/com/v2ray/ang/ui/premium/vpn/VpnMainScreen.kt

      - name: Commit copy cleanup and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ui-policy-copy-cleanup.yml
          git add app/src/main/java/com/v2ray/ang/ui/premium/PremiumActivity.kt app/src/main/java/com/v2ray/ang/ui/premium/vpn/VpnMainScreen.kt
          git commit -m "UI: simplify regional policy helper copy"
          git push origin HEAD:ui-policy-copy-cleanup-20260914
