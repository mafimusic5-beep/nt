name: Privacy checks

on:
  pull_request:
    paths:
      - 'app/**'
      - 'orchestrator/**'
      - 'emery vpn orchestrator/**'
      - 'docs/PRIVACY_DATA_MINIMIZATION.md'
      - '.github/workflows/privacy-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt
      - name: Validate and test legacy orchestrator
        run: |
          python -m compileall -q orchestrator
          python -m pip install -q --upgrade pip
          pip install -q -r orchestrator/requirements.txt pytest
          pytest -q orchestrator/tests

  modern-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: emery vpn orchestrator/requirements.txt
      - name: Install modern backend dependencies
        run: pip install -q -r 'emery vpn orchestrator/requirements.txt'
      - name: Validate and test modern backend
        id: modern-tests
        run: |
          set +e
          python -m compileall -q 'emery vpn orchestrator/src'
          cd 'emery vpn orchestrator'
          PYTHONPATH=. pytest -q tests 2>&1 | tee ../modern-tests.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload modern test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: modern-test-log
          path: modern-tests.log
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compile Android Kotlin
        id: android-build
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace 2>&1 | tee android-build.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload Android build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: error
