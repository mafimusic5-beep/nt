name: Apply Russian city flag label patch

on:
  push:
    branches:
      - fix/russian-city-flag-label

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/russian-city-flag-label
          fetch-depth: 0

      - name: Apply precise patch
        run: python3 .github/apply_location_label_patch.py

      - name: Validate Python
        run: |
          python3 -m py_compile \
            'emery vpn orchestrator/src/bot/handlers/server_setup.py' \
            'emery vpn orchestrator/src/bot/utils/geoip.py'
          git diff --check

      - name: Compile Android Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit validated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No patch changes found'; exit 1; }
          git commit -m 'Show VPN servers as flag and Russian city [location-label-patched]'
          git push origin HEAD:fix/russian-city-flag-label
