name: Apply durable release claim

on:
  push:
    branches:
      - feature/concurrent-vpn-resource-allocation
    paths:
      - tools/fix_concurrent_release_claim_v2.py
      - .github/workflows/apply-durable-release-claim.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/concurrent-vpn-resource-allocation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply durable claim fix
        run: python3 tools/fix_concurrent_release_claim_v2.py
      - name: Test orchestrator
        run: |
          python -m pip install --quiet -r orchestrator/requirements.txt pytest==8.4.2
          python -m compileall -q orchestrator
          PYTHONPATH=orchestrator python -m pytest -q orchestrator/tests
      - name: Test pool backend
        working-directory: emery vpn orchestrator
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m compileall -q src tests
          python -m pytest -q tests/test_pool_assignments.py tests/test_assignment_port_lifecycle.py
      - name: Commit durable fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orchestrator 'emery vpn orchestrator'
          git commit -m 'Make concurrent downgrade release crash-safe'
          git push origin HEAD:feature/concurrent-vpn-resource-allocation
