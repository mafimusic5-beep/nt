name: Apply release claim race fix

on:
  push:
    branches:
      - feature/concurrent-vpn-resource-allocation
    paths:
      - tools/fix_concurrent_release_claim.py
      - .github/workflows/apply-release-claim-race-fix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/concurrent-vpn-resource-allocation
          fetch-depth: 0
      - name: Apply race fix
        run: python3 tools/fix_concurrent_release_claim.py
      - name: Compile orchestrator
        run: python3 -m compileall -q orchestrator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test orchestrator
        run: |
          python -m pip install --quiet -r orchestrator/requirements.txt pytest==8.4.2
          PYTHONPATH=orchestrator python -m pytest -q orchestrator/tests
      - name: Test modern pool backend
        working-directory: emery vpn orchestrator
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m compileall -q src tests
          python -m pytest -q tests/test_pool_assignments.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orchestrator 'emery vpn orchestrator'
          git commit -m 'Claim local resources during concurrent downgrade release'
          git push origin HEAD:feature/concurrent-vpn-resource-allocation
