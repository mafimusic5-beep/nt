name: Apply concurrent release patch

on:
  push:
    branches:
      - feature/concurrent-vpn-resource-allocation
    paths:
      - tools/apply_concurrent_release_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/concurrent-vpn-resource-allocation
          fetch-depth: 0
      - name: Apply targeted backend patch
        run: python3 tools/apply_concurrent_release_patch.py
      - name: Sanity check
        run: |
          python3 -m py_compile \
            "emery vpn orchestrator/src/backend/schemas/pool_bridge.py" \
            "emery vpn orchestrator/src/backend/api/routes.py" \
            "emery vpn orchestrator/src/backend/services/pool_assignment_service.py" \
            orchestrator/concurrent_resource_allocator.py \
            orchestrator/pool_reservation_bridge.py \
            orchestrator/api.py
          git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release excess VPN resources after tariff downgrade"
          git push origin HEAD:feature/concurrent-vpn-resource-allocation
