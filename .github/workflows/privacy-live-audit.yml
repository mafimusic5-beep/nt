name: Live privacy data audit

on:
  push:
    branches:
      - feature/concurrent-vpn-resource-allocation
    paths:
      - '.github/workflows/privacy-live-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Audit live privacy state
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_USER:-}"
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]

          # Never put production addresses in this public workflow or print them
          # to the job log. The endpoint exists only in encrypted Actions secrets.
          remote="${VPS_USER}@${VPS_HOST}"
          ssh -4 -p "$port" -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            -o StrictHostKeyChecking=accept-new "$remote" <<'EOF'
          set -euo pipefail
          modern='/opt/nt/emery vpn orchestrator'
          runtime='/opt/nt/.runtime/modern'

          user_audit=no
          heartbeat_history=no
          log_masking=no
          migration=no
          nginx_no_access=no
          uvicorn_no_access=no
          xray_no_activity_log=not_present
          gate_no_activity_log=not_present
          user_audit_rows=unknown
          last_seen_rows=unknown

          audit_file="$modern/src/backend/repositories/audit_repo.py"
          subscription_file="$modern/src/backend/repositories/subscription_repo.py"
          logging_file="$modern/src/backend/core/logging.py"

          if [[ -f "$audit_file" ]] && grep -Fq 'actor_type.strip().lower() == "user"' "$audit_file"; then
            user_audit=yes
          fi
          if [[ -f "$subscription_file" ]] && grep -Fq 'Heartbeat is authorization only' "$subscription_file"; then
            heartbeat_history=yes
          fi
          if [[ -f "$logging_file" ]] && grep -Fq 'uvicorn.access' "$logging_file" && grep -Fq 'client_ip=' "$logging_file"; then
            log_masking=yes
          fi

          if nginx -T >/tmp/skryon-nginx-audit 2>/dev/null; then
            if grep -Eq '^[[:space:]]*access_log[[:space:]]+off;' /tmp/skryon-nginx-audit; then
              nginx_no_access=yes
            fi
          fi
          rm -f /tmp/skryon-nginx-audit

          if systemctl cat emery-backend.service >/tmp/skryon-backend-unit 2>/dev/null; then
            if grep -Fq -- '--no-access-log' /tmp/skryon-backend-unit; then
              uvicorn_no_access=yes
            fi
          elif pgrep -af 'uvicorn.*src\.backend\.main:app' >/tmp/skryon-uvicorn-process 2>/dev/null; then
            if grep -Fq -- '--no-access-log' /tmp/skryon-uvicorn-process; then
              uvicorn_no_access=yes
            fi
          fi
          rm -f /tmp/skryon-backend-unit /tmp/skryon-uvicorn-process

          xray_config=''
          for candidate in /usr/local/etc/xray/config.json /etc/xray/config.json; do
            if [[ -f "$candidate" ]]; then
              xray_config="$candidate"
              break
            fi
          done
          if [[ -n "$xray_config" ]]; then
            xray_no_activity_log=no
            if python3 - "$xray_config" <<'PY'
          import json
          import sys
          with open(sys.argv[1], 'r', encoding='utf-8') as handle:
              config = json.load(handle)
          log = config.get('log') or {}
          ok = (
              log.get('access') == 'none'
              and log.get('error') == 'none'
              and log.get('loglevel') == 'none'
              and log.get('dnsLog') is False
          )
          raise SystemExit(0 if ok else 1)
          PY
            then
              xray_no_activity_log=yes
            fi
          fi

          if [[ -f /etc/emery/device-gate.env ]]; then
            gate_no_activity_log=no
            if grep -Eq '^EMERY_GATE_LOG_LEVEL=CRITICAL$' /etc/emery/device-gate.env; then
              gate_no_activity_log=yes
            fi
          fi

          if [[ -x "$runtime/bin/alembic" && -f "$modern/alembic.ini" ]]; then
            current="$(cd "$modern" && "$runtime/bin/alembic" current 2>/dev/null || true)"
            [[ "$current" == *'0016_privacy_data_minimization'* ]] && migration=yes || true
          fi

          if [[ -x "$runtime/bin/python" && -f "$modern/.env" ]]; then
            counts="$(cd "$modern" && "$runtime/bin/python" - <<'PY'
          from sqlalchemy import create_engine, text
          from dotenv import dotenv_values
          from pathlib import Path

          values = dotenv_values(Path('.env'))
          db_url = values.get('DB_URL') or values.get('DATABASE_URL')
          if not db_url:
              print('unknown unknown')
              raise SystemExit(0)
          engine = create_engine(db_url)
          with engine.connect() as connection:
              audit = connection.execute(text("SELECT COUNT(*) FROM audit_logs WHERE actor_type = 'user'" )).scalar_one()
              seen = connection.execute(text("SELECT COUNT(*) FROM devices WHERE last_seen_at IS NOT NULL" )).scalar_one()
          print(f'{audit} {seen}')
          PY
          )"
            read -r user_audit_rows last_seen_rows <<<"$counts"
          fi

          printf 'LIVE_USER_AUDIT_BLOCKED=%s\n' "$user_audit"
          printf 'LIVE_HEARTBEAT_HISTORY_BLOCKED=%s\n' "$heartbeat_history"
          printf 'LIVE_LOG_REDACTION=%s\n' "$log_masking"
          printf 'LIVE_PRIVACY_MIGRATION=%s\n' "$migration"
          printf 'LIVE_NGINX_ACCESS_LOG_DISABLED=%s\n' "$nginx_no_access"
          printf 'LIVE_UVICORN_ACCESS_LOG_DISABLED=%s\n' "$uvicorn_no_access"
          printf 'LIVE_XRAY_ACTIVITY_LOG_DISABLED=%s\n' "$xray_no_activity_log"
          printf 'LIVE_GATE_ACTIVITY_LOG_DISABLED=%s\n' "$gate_no_activity_log"
          printf 'LIVE_USER_AUDIT_ROWS=%s\n' "$user_audit_rows"
          printf 'LIVE_LAST_SEEN_ROWS=%s\n' "$last_seen_rows"
          EOF
