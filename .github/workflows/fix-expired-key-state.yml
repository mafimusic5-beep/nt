name: Fix expired key status

on:
  push:
    branches:
      - fix/rkn-blacklist-full-tunnel
    paths:
      - '.github/workflows/fix-expired-key-state.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rkn-blacklist-full-tunnel
          fetch-depth: 0
      - name: Preserve expired status and test it
        shell: python
        run: |
          from pathlib import Path

          storage_path = Path('orchestrator/storage.py')
          storage = storage_path.read_text(encoding='utf-8')
          old_lookup = '''def get_activation_code(code: str) -> Optional[Dict[str, Any]]:
              formatted = format_code(code)
              with connect() as con:
                  row = con.execute(
                      'SELECT code, status, expires_at, max_devices, plan, (SELECT COUNT(*) FROM code_devices WHERE code_devices.code = activation_codes.code) AS used_devices FROM activation_codes WHERE code = ?',
                      (formatted,),
                  ).fetchone()
              return dict(row) if row else None
          '''
          new_lookup = '''def get_activation_code(code: str) -> Optional[Dict[str, Any]]:
              formatted = format_code(code)
              with connect() as con:
                  row = con.execute(
                      'SELECT code, status, expires_at, max_devices, plan, (SELECT COUNT(*) FROM code_devices WHERE code_devices.code = activation_codes.code) AS used_devices FROM activation_codes WHERE code = ?',
                      (formatted,),
                  ).fetchone()
                  if not row:
                      return None
                  result = dict(row)
                  expires_at = parse_iso(result.get('expires_at'))
                  if result.get('status') == 'active' and expires_at and expires_at <= datetime.now(timezone.utc):
                      con.execute('UPDATE activation_codes SET status = ? WHERE code = ?', ('expired', formatted))
                      result['status'] = 'expired'
                  return result
          '''
          if old_lookup not in storage:
              raise SystemExit('get_activation_code block not found')
          storage = storage.replace(old_lookup, new_lookup, 1)

          old_list = '''def get_codes(limit: int = 20) -> List[Dict[str, Any]]:
              with connect() as con:
                  rows = con.execute(
          '''
          new_list = '''def get_codes(limit: int = 20) -> List[Dict[str, Any]]:
              with connect() as con:
                  con.execute(
                      'UPDATE activation_codes SET status = ? WHERE status = ? AND expires_at IS NOT NULL AND expires_at <= ?',
                      ('expired', 'active', now_iso()),
                  )
                  rows = con.execute(
          '''
          if old_list not in storage:
              raise SystemExit('get_codes block not found')
          storage = storage.replace(old_list, new_list, 1)
          storage_path.write_text(storage, encoding='utf-8')

          auth_path = Path('orchestrator/device_auth.py')
          auth = auth_path.read_text(encoding='utf-8')
          old_except = '''    except Exception:
                  con.rollback()
                  raise
              finally:
                  con.close()
          '''
          new_except = '''    except DeviceAuthError as error:
                  if error.reason == 'expired':
                      con.commit()
                  else:
                      con.rollback()
                  raise
              except Exception:
                  con.rollback()
                  raise
              finally:
                  con.close()
          '''
          if auth.count(old_except) != 2:
              raise SystemExit(f'Expected two transaction exception blocks, found {auth.count(old_except)}')
          auth = auth.replace(old_except, new_except, 2)
          auth_path.write_text(auth, encoding='utf-8')

          test_path = Path('orchestrator/tests/test_activation_keys.py')
          tests = test_path.read_text(encoding='utf-8')
          old_assert = '''        self.assertEqual('expired', expired.exception.reason)

                  banned_code = self.create_code('personal', 1)
          '''
          new_assert = '''        self.assertEqual('expired', expired.exception.reason)
                  self.assertEqual('expired', storage.get_activation_code(expired_code)['status'])

                  banned_code = self.create_code('personal', 1)
          '''
          if old_assert not in tests:
              raise SystemExit('Expired key assertion block not found')
          test_path.write_text(tests.replace(old_assert, new_assert, 1), encoding='utf-8')
      - name: Compile patched backend
        run: python -m compileall -q orchestrator
      - name: Commit expired status fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orchestrator/storage.py orchestrator/device_auth.py orchestrator/tests/test_activation_keys.py
          git commit -m 'Persist expired activation key status'
          git push origin HEAD:fix/rkn-blacklist-full-tunnel
