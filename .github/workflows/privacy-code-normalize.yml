name: One-shot privacy code normalization

on:
  push:
    branches:
      - feature/concurrent-vpn-resource-allocation
    paths:
      - '.github/workflows/privacy-code-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/concurrent-vpn-resource-allocation
          fetch-depth: 0

      - name: Apply exact privacy-only patches
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Legacy device auth: retain only entitlement/key-binding state. Do
          # not create a device activity timeline or persist client labels/app version.
          path = 'orchestrator/device_auth.py'
          replace_once(
              path,
              '''        con.execute(
              ''' + '''            \'''\'''\''
              UPDATE code_devices
              SET first_seen_at = COALESCE(first_seen_at, activated_at),
                  last_seen_at = COALESCE(last_seen_at, activated_at),
                  active = COALESCE(active, 1)
              \'''\'''\''
          )''',
              '''        con.execute(
              ''' + '''            \'''\'''\''
              UPDATE code_devices
              SET device_name = ?,
                  platform = 'android',
                  app_version = '',
                  first_seen_at = NULL,
                  last_seen_at = NULL,
                  active = COALESCE(active, 1)
              \'''\'''\'',
              (DEFAULT_DEVICE_NAME,),
          )''',
          )
          replace_once(
              path,
              '''        ORDER BY active DESC, last_seen_at DESC, id ASC''',
              '''        ORDER BY active DESC, id ASC''',
          )
          replace_once(
              path,
              "            'device_name': _public_device_name(str(row['device_name'] or '')),\n            'platform': 'android',\n            'app_version': '',\n            'first_seen_at': row['first_seen_at'] or '',\n            'last_seen_at': row['last_seen_at'] or '',",
              "            'device_name': DEFAULT_DEVICE_NAME,\n            'platform': 'android',\n            'app_version': '',\n            'first_seen_at': '',\n            'last_seen_at': '',",
          )
          replace_once(
              path,
              "        'device_name': _public_device_name(str(current['device_name'] or '')),",
              "        'device_name': DEFAULT_DEVICE_NAME,",
          )
          replace_once(
              path,
              '''    safe_device_name = _public_device_name(signed_device_name)''',
              '''    safe_device_name = DEFAULT_DEVICE_NAME''',
          )
          replace_once(
              path,
              '''            con.execute(
                  \'''\'''\''
                  UPDATE code_devices
                  SET device_name = ?,
                      public_key = ?,
                      public_key_fingerprint = ?,
                      platform = ?,
                      app_version = ?,
                      first_seen_at = COALESCE(first_seen_at, activated_at, ?),
                      last_seen_at = ?,
                      active = 1
                  WHERE id = ?
                  \'''\'''\'',
                  (
                      safe_device_name,
                      public_key_base64,
                      fingerprint,
                      'android',
                      app_version.strip()[:32],
                      current_time,
                      current_time,
                      existing['id'],
                  ),
              )''',
              '''            con.execute(
                  \'''\'''\''
                  UPDATE code_devices
                  SET device_name = ?,
                      public_key = ?,
                      public_key_fingerprint = ?,
                      platform = 'android',
                      app_version = '',
                      first_seen_at = NULL,
                      last_seen_at = NULL,
                      active = 1
                  WHERE id = ?
                  \'''\'''\'',
                  (
                      DEFAULT_DEVICE_NAME,
                      public_key_base64,
                      fingerprint,
                      existing['id'],
                  ),
              )''',
          )
          replace_once(
              path,
              '''                ORDER BY last_seen_at DESC, id ASC''',
              '''                ORDER BY id ASC''',
          )
          replace_once(
              path,
              '''            con.execute(
                  \'''\'''\''
                  INSERT INTO code_devices(
                      code,
                      device_id,
                      activated_at,
                      device_name,
                      public_key,
                      public_key_fingerprint,
                      platform,
                      app_version,
                      first_seen_at,
                      last_seen_at,
                      active
                  )
                  VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, 1)
                  \'''\'''\'',
                  (
                      code,
                      safe_device_id,
                      current_time,
                      safe_device_name,
                      public_key_base64,
                      fingerprint,
                      'android',
                      app_version.strip()[:32],
                      current_time,
                      current_time,
                  ),
              )''',
              '''            con.execute(
                  \'''\'''\''
                  INSERT INTO code_devices(
                      code,
                      device_id,
                      activated_at,
                      device_name,
                      public_key,
                      public_key_fingerprint,
                      platform,
                      app_version,
                      first_seen_at,
                      last_seen_at,
                      active
                  )
                  VALUES (?, ?, ?, ?, ?, ?, 'android', '', NULL, NULL, 1)
                  \'''\'''\'',
                  (
                      code,
                      safe_device_id,
                      current_time,
                      DEFAULT_DEVICE_NAME,
                      public_key_base64,
                      fingerprint,
                  ),
              )''',
          )
          replace_once(
              path,
              '''        current_time = now_iso()
          con.execute(
              'UPDATE code_devices SET last_seen_at = ? WHERE id = ?',
              (current_time, device['id']),
          )''',
              '''        con.execute(
              'UPDATE code_devices SET last_seen_at = NULL WHERE id = ?',
              (device['id'],),
          )''',
          )
          replace_once(
              path,
              '''        con.execute(
              'UPDATE code_devices SET last_seen_at = ? WHERE id = ?',
              (now_iso(), int(row['device_row_id'])),
          )''',
              '''        con.execute(
              'UPDATE code_devices SET last_seen_at = NULL WHERE id = ?',
              (int(row['device_row_id']),),
          )''',
          )

          # Legacy API rate limiting may use the source IP transiently, but the
          # in-memory bucket key must not contain the raw IP or device id.
          path = 'orchestrator/api.py'
          replace_once(path, 'import concurrent_sessions\nimport sqlite3', 'import concurrent_sessions\nimport hashlib\nimport hmac\nimport sqlite3')
          replace_once(
              path,
              '''_attempts: Dict[str, Deque[float]] = defaultdict(deque)''',
              '''_attempts: Dict[str, Deque[float]] = defaultdict(deque)
_RATE_LIMIT_KEY = secrets.token_bytes(32)''',
          )
          replace_once(
              path,
              '''def client_key(request: Request, payload: ActivationRequest) -> str:
              forwarded = request.headers.get('x-forwarded-for', '')
              ip = forwarded.split(',')[0].strip() if forwarded else (request.client.host if request.client else 'unknown')
              device = payload.deviceId.strip()[:64]
              return ip + ':' + device''',
              '''def client_key(request: Request, payload: ActivationRequest) -> str:
              forwarded = request.headers.get('x-forwarded-for', '')
              ip = forwarded.split(',')[0].strip() if forwarded else (request.client.host if request.client else 'unknown')
              device = payload.deviceId.strip()[:64]
              material = (ip + '\\0' + device).encode('utf-8')
              return hmac.new(_RATE_LIMIT_KEY, material, hashlib.sha256).hexdigest()''',
          )

          # Every Xray credential mutation reasserts no-activity logging, so a
          # manual config edit cannot silently turn connection logging back on.
          path = 'emery vpn orchestrator/src/backend/services/xray_credential_service.py'
          replace_once(
              path,
              '''config = json.loads(original_text)
          original_config = json.loads(original_text)''',
              '''config = json.loads(original_text)
          original_config = json.loads(original_text)
          config["log"] = {
              "access": "none",
              "error": "none",
              "loglevel": "none",
              "dnsLog": False,
          }''',
          )
          replace_once(
              path,
              '''    settings_block["clients"] = [{
                  "id": DATA["client_uuid"],
                  "flow": flow,
                  "email": tag,
              }]''',
              '''    settings_block["clients"] = [{
                  "id": DATA["client_uuid"],
                  "flow": flow,
              }]''',
          )
          PY

      - name: Validate syntax and diff
        run: |
          set -euo pipefail
          git diff --check
          python3 -m compileall -q orchestrator 'emery vpn orchestrator/src/backend/services/xray_credential_service.py'
          git diff --exit-code -- .github/workflows/privacy-code-normalize.yml
          git diff -- orchestrator/device_auth.py orchestrator/api.py 'emery vpn orchestrator/src/backend/services/xray_credential_service.py'

      - name: Commit normalized privacy code
        run: |
          set -euo pipefail
          git config user.name 'skryon-privacy-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add orchestrator/device_auth.py orchestrator/api.py 'emery vpn orchestrator/src/backend/services/xray_credential_service.py'
          git diff --cached --quiet && { echo 'No changes produced.' >&2; exit 1; }
          git commit -m 'Minimize legacy VPN activity metadata'
          git push origin HEAD:feature/concurrent-vpn-resource-allocation
