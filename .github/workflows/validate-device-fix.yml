name: Validate device activation fix

on:
  push:
    branches:
      - fix/rkn-blacklist-full-tunnel
  pull_request:
    branches:
      - fix/activation-connectivity-latest-ui

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r orchestrator/requirements.txt
      - name: Compile backend
        run: python -m compileall -q orchestrator

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Assemble Playstore debug
        run: ./gradlew :app:assemblePlaystoreDebug --no-daemon --stacktrace
