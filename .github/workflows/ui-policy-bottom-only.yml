name: Apply bottom policy copy only

on:
  push:
    branches:
      - ui-policy-bottom-only-20260914
    paths:
      - '.github/workflows/ui-policy-bottom-only.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ui-policy-bottom-only-20260914

      - name: Restore onboarding copy and change only bottom text
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/v2ray/ang/ui/premium/PremiumActivity.kt')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'description = "Для использования за пределами Российской Федерации"': 'description = "VPN используется за пределами Российской Федерации"',
              'description = "Для использования в Российской Федерации"': 'description = "Для использования в РФ; ограниченные ресурсы блокируются"',
              'text = "Режим можно изменить позже в разделе «Расширенные»."': 'text = "Если вы находитесь не в РФ, выберите «Международный». Позже политику можно переключить в разделе «Расширенные»."',
              'text = "Местоположение не определяется автоматически."': 'text = "Сервис не определяет, не проверяет и не сохраняет ваше местоположение."',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence: {old!r}, found {text.count(old)}')
              text = text.replace(old, new)

          anchor = '''                OnboardingPolicyChoice(
                    selected = selectedMode == RegionalPolicyMode.Russia,
                    enabled = !saving,
                    title = "Российская Федерация",
                    description = "Для использования в РФ; ограниченные ресурсы блокируются",
                    onClick = { selectedMode = RegionalPolicyMode.Russia },
                )

                Spacer(Modifier.height(16.dp))'''
          replacement = '''                OnboardingPolicyChoice(
                    selected = selectedMode == RegionalPolicyMode.Russia,
                    enabled = !saving,
                    title = "Российская Федерация",
                    description = "Для использования в РФ; ограниченные ресурсы блокируются",
                    onClick = { selectedMode = RegionalPolicyMode.Russia },
                )

                Spacer(Modifier.height(14.dp))
                Text(
                    text = "Выбранный режим определяет правила работы VPN для текущей территории использования.",
                    style = MaterialTheme.typography.bodyMedium,
                    color = Color(0xFF111319),
                    fontWeight = FontWeight.Medium,
                )

                Spacer(Modifier.height(16.dp))'''
          if text.count(anchor) != 1:
              raise SystemExit(f'Bottom insertion anchor count: {text.count(anchor)}')
          text = text.replace(anchor, replacement)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- app/src/main/java/com/v2ray/ang/ui/premium/PremiumActivity.kt

      - name: Commit UI copy and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ui-policy-bottom-only.yml
          git add app/src/main/java/com/v2ray/ang/ui/premium/PremiumActivity.kt
          git commit -m "UI: change only regional policy bottom copy"
          git push origin HEAD:ui-policy-bottom-only-20260914
