name: Apply UI location header patch

on:
  push:
    branches:
      - ui-location-header-20260913
    paths:
      - '.github/workflows/ui-location-header-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ui-location-header-20260913

      - name: Move location into the right side of the header
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/v2ray/ang/ui/premium/vpn/VpnMainScreen.kt')
          text = path.read_text(encoding='utf-8')

          old = '''@Composable
          private fun HeaderBar(selectedLocation: VpnLocationOption, compact: Boolean) {
              Column(
                  modifier = Modifier.fillMaxWidth(),
                  horizontalAlignment = Alignment.Start,
              ) {
                  Row(
                      modifier = Modifier.heightIn(min = if (compact) 48.dp else 54.dp),
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      Text(
                          text = "Skryon",
                          style = if (compact) MaterialTheme.typography.headlineSmall else MaterialTheme.typography.headlineMedium,
                          fontWeight = FontWeight.SemiBold,
                          color = AppUiColors.TextPrimary,
                          maxLines = 1,
                      )
                      Spacer(Modifier.width(7.dp))
                      Text(text = "VPN", style = MaterialTheme.typography.titleSmall, color = AppUiColors.TextSecondary, maxLines = 1)
                  }
                  Spacer(Modifier.height(if (compact) 4.dp else 6.dp))
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      Icon(
                          imageVector = Icons.Filled.LocationOn,
                          contentDescription = null,
                          tint = AppUiColors.TextPrimary,
                          modifier = Modifier.size(if (compact) 20.dp else 24.dp),
                      )
                      Spacer(Modifier.width(7.dp))
                      Text(
                          text = selectedLocation.cityLabel(),
                          modifier = Modifier.weight(1f),
                          style = if (compact) MaterialTheme.typography.titleMedium else MaterialTheme.typography.titleLarge,
                          color = AppUiColors.TextPrimary,
                          fontWeight = FontWeight.Medium,
                          textAlign = TextAlign.Start,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                      )
                  }
              }
          }'''

          new = '''@Composable
          private fun HeaderBar(selectedLocation: VpnLocationOption, compact: Boolean) {
              val locationLabel = selectedLocation.cityLabel().let { city ->
                  if (city == "Франкфурт") "Франкфурт-на-Майне" else city
              }

              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .heightIn(min = if (compact) 48.dp else 54.dp),
                  verticalAlignment = Alignment.CenterVertically,
              ) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Text(
                          text = "Skryon",
                          style = if (compact) MaterialTheme.typography.headlineSmall else MaterialTheme.typography.headlineMedium,
                          fontWeight = FontWeight.SemiBold,
                          color = AppUiColors.TextPrimary,
                          maxLines = 1,
                      )
                      Spacer(Modifier.width(7.dp))
                      Text(
                          text = "VPN",
                          style = MaterialTheme.typography.titleSmall,
                          color = AppUiColors.TextSecondary,
                          maxLines = 1,
                      )
                  }

                  Spacer(Modifier.width(if (compact) 12.dp else 16.dp))

                  Row(
                      modifier = Modifier.weight(1f),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.End,
                  ) {
                      Icon(
                          imageVector = Icons.Filled.LocationOn,
                          contentDescription = null,
                          tint = AppUiColors.TextPrimary,
                          modifier = Modifier.size(if (compact) 18.dp else 20.dp),
                      )
                      Spacer(Modifier.width(6.dp))
                      Text(
                          text = locationLabel,
                          modifier = Modifier.weight(1f, fill = false),
                          style = if (compact) MaterialTheme.typography.bodyLarge else MaterialTheme.typography.titleMedium,
                          color = AppUiColors.TextPrimary,
                          fontWeight = FontWeight.Medium,
                          textAlign = TextAlign.End,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                      )
                  }
              }
          }'''

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one HeaderBar block, found {text.count(old)}')

          text = text.replace(old, new)
          if 'val selectedTitle = "Выбрать регион"' not in text:
              raise SystemExit('Region selector label unexpectedly changed')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- app/src/main/java/com/v2ray/ang/ui/premium/vpn/VpnMainScreen.kt

      - name: Commit only the UI change and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ui-location-header-patch.yml
          git add app/src/main/java/com/v2ray/ang/ui/premium/vpn/VpnMainScreen.kt
          git commit -m "UI: move current location to header right"
          git push origin HEAD:ui-location-header-20260913
