name: Bump signed activation version

on:
  push:
    branches:
      - fix/rkn-blacklist-full-tunnel
    paths:
      - '.github/workflows/bump-signed-activation-version.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rkn-blacklist-full-tunnel
          fetch-depth: 0
      - name: Bump Android protocol version
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/build.gradle.kts')
          text = path.read_text(encoding='utf-8-sig')
          replacements = {
              'val appVersionCode = 716': 'val appVersionCode = 717',
              'versionName = "2.0.16"': 'versionName = "2.0.17"',
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f'Expected version marker not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Verify version markers
        run: |
          grep -F 'val appVersionCode = 717' app/build.gradle.kts
          grep -F 'versionName = "2.0.17"' app/build.gradle.kts
      - name: Commit version bump
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts
          git commit -m 'Bump signed activation protocol to 717'
          git push origin HEAD:fix/rkn-blacklist-full-tunnel
