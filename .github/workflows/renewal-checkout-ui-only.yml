name: Deploy renewal checkout UI lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/renewal-checkout-ui-only.yml'
      - 'tools/deploy_renewal_checkout_ui.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy renewal UI lock
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash tools/deploy_renewal_checkout_ui.sh
