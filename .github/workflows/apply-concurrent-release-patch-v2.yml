name: Apply concurrent release patch v2

on:
  push:
    branches:
      - feature/concurrent-vpn-resource-allocation
    paths:
      - tools/apply_concurrent_release_patch_v2.py
      - .github/workflows/apply-concurrent-release-patch-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/concurrent-vpn-resource-allocation
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply_concurrent_release_patch_v2.py
      - name: Syntax check
        run: |
          python3 -m py_compile \
            orchestrator/concurrent_resource_allocator.py \
            orchestrator/pool_reservation_bridge.py \
            orchestrator/api.py \
            'emery vpn orchestrator/src/backend/schemas/pool_bridge.py' \
            'emery vpn orchestrator/src/backend/api/routes.py' \
            'emery vpn orchestrator/src/backend/services/pool_assignment_service.py'
      - name: Commit backend release fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orchestrator 'emery vpn orchestrator'
          if git diff --cached --quiet; then
            echo 'No code changes to commit'
          else
            git commit -m 'Release excess concurrent VPN resources after downgrade'
            git push origin HEAD:feature/concurrent-vpn-resource-allocation
          fi
