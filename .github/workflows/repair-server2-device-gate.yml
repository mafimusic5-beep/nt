name: Repair server-2 device gate control path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-server2-device-gate.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure backend SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Repair device-gate authorization path
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          deploy_host=""
          deploy_port=""
          seen=" "
          for host in 31.70.76.155 "${VPS_HOST:-}"; do
            [[ -n "$host" ]] || continue
            host="${host#http://}"; host="${host#https://}"; host="${host%%/*}"; host="${host%%:*}"
            for port in "${VPS_PORT:-}" 22 8443 2022 2222 2200 22222 8022; do
              [[ "$port" =~ ^[0-9]+$ ]] || continue
              key=" $host:$port "; [[ "$seen" != *"$key"* ]] || continue; seen+="$key"
              if ssh -4 -p "$port" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "${VPS_USER:-root}@$host" true >/dev/null 2>&1; then
                deploy_host="$host"; deploy_port="$port"; break 2
              fi
            done
          done
          [[ -n "$deploy_host" ]]
          ssh -4 -p "$deploy_port" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o StrictHostKeyChecking=accept-new "${VPS_USER:-root}@$deploy_host" <<'EOF'
          set -euo pipefail
          cd '/opt/nt/emery vpn orchestrator'
          /opt/nt/.runtime/modern/bin/python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import stat
          import time

          from src.backend.services.node_recovery_service import SshAndProviderRecoveryTransport
          from src.common.config import settings
          from src.common.db import SessionLocal
          from src.common.models import VpnNode

          TARGET_IP = '82.165.163.77'
          PRIVATE_URL = 'http://127.0.0.1:18081/internal/device-gate/authorize'
          ENV_PATH = '/etc/emery/device-gate.env'

          def run(client, command: str, timeout: int = 25):
              _stdin, stdout, stderr = client.exec_command(command, timeout=timeout)
              out = stdout.read().decode(errors='ignore').strip()
              err = stderr.read().decode(errors='ignore').strip()
              rc = stdout.channel.recv_exit_status()
              return rc, out, err

          def parse_env(text: str) -> dict[str, str]:
              values: dict[str, str] = {}
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key, value = line.split('=', 1)
                  values[key.strip()] = value.strip()
              return values

          def replace_env(text: str, updates: dict[str, str]) -> str:
              seen: set[str] = set()
              result: list[str] = []
              for raw in text.splitlines():
                  if '=' in raw and not raw.lstrip().startswith('#'):
                      key = raw.split('=', 1)[0].strip()
                      if key in updates:
                          result.append(f'{key}={updates[key]}')
                          seen.add(key)
                          continue
                  result.append(raw)
              for key, value in updates.items():
                  if key not in seen:
                      result.append(f'{key}={value}')
              return '\n'.join(result).rstrip() + '\n'

          db = SessionLocal()
          client = None
          sftp = None
          try:
              node = db.query(VpnNode).filter(VpnNode.endpoint == TARGET_IP).first()
              if node is None:
                  raise RuntimeError('server2_node_not_found')
              print(f'NODE_FOUND id={node.id} endpoint={node.endpoint} gate_port={int(node.device_gate_port or 0)}')
              client = SshAndProviderRecoveryTransport()._connect(node)

              for unit in ('xray.service', 'emery-device-gate.service', 'emery-control-tunnel.service'):
                  rc, out, _ = run(client, f'systemctl is-active {unit} 2>/dev/null || true')
                  print(f'UNIT {unit}={out or "unknown"}')

              sftp = client.open_sftp()
              with sftp.open(ENV_PATH, 'r') as handle:
                  raw_env = handle.read().decode('utf-8')
              env = parse_env(raw_env)
              current_url = env.get('EMERY_GATE_AUTHORIZE_URL', '')
              current_key = env.get('EMERY_GATE_AUTHORIZE_KEY', '')
              backend_key = str(settings.device_gate_api_key or '').strip()
              if len(backend_key) < 32:
                  raise RuntimeError('backend_device_gate_key_missing')
              print(f'AUTH_URL_BEFORE={current_url}')
              print(f'AUTH_KEY_MATCH_BEFORE={str(current_key == backend_key).lower()}')

              rc, out, _ = run(client, "systemctl is-active --quiet emery-control-tunnel.service && curl -fsS --max-time 4 http://127.0.0.1:18081/health >/dev/null && echo ready || true")
              tunnel_ready = out.strip() == 'ready'
              if not tunnel_ready:
                  run(client, 'systemctl restart emery-control-tunnel.service >/dev/null 2>&1 || true')
                  time.sleep(2)
                  rc, out, _ = run(client, "systemctl is-active --quiet emery-control-tunnel.service && curl -fsS --max-time 4 http://127.0.0.1:18081/health >/dev/null && echo ready || true")
                  tunnel_ready = out.strip() == 'ready'
              print(f'PRIVATE_CONTROL_READY={str(tunnel_ready).lower()}')

              selected_url = PRIVATE_URL if tunnel_ready else str(settings.manual_bootstrap_device_gate_authorize_url or '').strip()
              if not selected_url:
                  raise RuntimeError('device_gate_authorize_url_missing')

              updated_env = replace_env(
                  raw_env,
                  {
                      'EMERY_GATE_AUTHORIZE_URL': selected_url,
                      'EMERY_GATE_AUTHORIZE_KEY': backend_key,
                  },
              )
              st = sftp.stat(ENV_PATH)
              tmp_path = ENV_PATH + '.repair'
              with sftp.open(tmp_path, 'w') as handle:
                  handle.write(updated_env)
              sftp.chmod(tmp_path, stat.S_IMODE(st.st_mode))
              try:
                  sftp.chown(tmp_path, st.st_uid, st.st_gid)
              except (AttributeError, OSError):
                  pass
              try:
                  sftp.posix_rename(tmp_path, ENV_PATH)
              except Exception:
                  run(client, f'mv {tmp_path} {ENV_PATH}')

              rc, _, err = run(client, 'systemctl restart emery-device-gate.service && sleep 2 && systemctl is-active --quiet emery-device-gate.service')
              if rc != 0:
                  raise RuntimeError('device_gate_restart_failed:' + err[:120])
              print(f'AUTH_URL_AFTER={selected_url}')
              print('AUTH_KEY_MATCH_AFTER=true')

              # Exercise the exact authorization transport with the real gate key,
              # but a deliberately nonexistent assignment. A fast 403 with
              # device_gate_not_authorized proves transport + shared key + API path.
              diagnostic = r'''python3 - <<'P'
          import json, time, urllib.error, urllib.request
          values={}
          for raw in open('/etc/emery/device-gate.env', encoding='utf-8'):
              line=raw.strip()
              if line and not line.startswith('#') and '=' in line:
                  k,v=line.split('=',1); values[k]=v
          now=str(int(time.time()*1000))
          body={
              'assignment_id':2147483646,
              'node_id':int(values['EMERY_GATE_NODE_ID']),
              'gate_server_name':values['EMERY_GATE_SERVER_NAME'],
              'gate_spki_sha256':values['EMERY_GATE_SPKI_SHA256'],
              'device_id':'gate-diagnostic',
              'server_issued_at':now,
              'timestamp':now,
              'server_nonce':'s'*32,
              'client_nonce':'c'*32,
              'signature':'A'*32,
              'signature_algorithm':'SHA256withECDSA',
          }
          req=urllib.request.Request(values['EMERY_GATE_AUTHORIZE_URL'], data=json.dumps(body).encode(), headers={'Content-Type':'application/json','X-Device-Gate-Key':values['EMERY_GATE_AUTHORIZE_KEY']}, method='POST')
          started=time.monotonic()
          status=0; reason=''
          try:
              with urllib.request.urlopen(req, timeout=8) as r:
                  status=r.status; raw=r.read(8192)
          except urllib.error.HTTPError as e:
              status=e.code; raw=e.read(8192)
          except Exception as e:
              print('AUTH_TRANSPORT_ERROR='+type(e).__name__)
              raise SystemExit(2)
          try:
              reason=str(json.loads(raw or b'{}').get('reason') or '')
          except Exception:
              reason='invalid_json'
          elapsed=int((time.monotonic()-started)*1000)
          print(f'AUTH_TRANSPORT_STATUS={status} reason={reason} elapsed_ms={elapsed}')
          if status != 403 or reason != 'device_gate_not_authorized':
              raise SystemExit(3)
          P'''
              rc, out, err = run(client, diagnostic, timeout=15)
              print(out)
              if rc != 0:
                  raise RuntimeError('device_gate_control_probe_failed:' + (err or out)[-160:])

              rc, out, _ = run(client, "journalctl -u emery-device-gate.service --since '3 minutes ago' --no-pager -n 30 | sed -E 's/[A-Za-z0-9+\/=]{40,}/[redacted]/g' || true")
              if out:
                  print('GATE_LOG_TAIL_BEGIN')
                  print(out)
                  print('GATE_LOG_TAIL_END')
          finally:
              if sftp is not None:
                  sftp.close()
              if client is not None:
                  client.close()
              db.close()
          PY
          EOF
