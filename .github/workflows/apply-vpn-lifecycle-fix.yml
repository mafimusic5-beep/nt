name: Apply VPN lifecycle fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-vpn-lifecycle-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write fixed VPN ViewModel
        shell: python
        env:
          VM_GZ_B64: 
          VM_SHA256: 858f945a485f3d0d5efe7b7f35c3b43f09efcd88e3cfdfea3568198c275021b8
        run: |
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          data = gzip.decompress(base64.b64decode(os.environ["VM_GZ_B64"]))
          actual = hashlib.sha256(data).hexdigest()
          expected = os.environ["VM_SHA256"]
          if actual != expected:
              raise SystemExit(f"ViewModel payload checksum mismatch: {actual}")

          path = Path("app/src/main/java/com/v2ray/ang/ui/premium/vpn/VpnMainViewModel.kt")
          path.write_bytes(data)

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f app/src/main/java/com/v2ray/ang/ui/premium/vpn/VpnTunnelTrafficVerifier.kt
          grep -q 'VPN core started; verifying tunnel traffic' app/src/main/java/com/v2ray/ang/ui/premium/vpn/VpnMainViewModel.kt
          grep -q 'stopWaiter' app/src/main/java/com/v2ray/ang/ui/premium/vpn/VpnMainViewModel.kt
          if git diff --quiet -- app/src/main/java/com/v2ray/ang/ui/premium/vpn/VpnMainViewModel.kt; then
            echo 'No ViewModel change required'
            exit 0
          fi
          git add app/src/main/java/com/v2ray/ang/ui/premium/vpn/VpnMainViewModel.kt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix VPN reconnect and verify tunnel traffic'
          git push origin HEAD:main
