name: Apply two-phase activation patch v2

on:
  push:
    branches:
      - feature/two-phase-activation
    paths:
      - .github/workflows/apply-two-phase-activation-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/two-phase-activation

      - name: Apply targeted patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          device_auth_path = 'orchestrator/device_auth.py'
          anchor = '''\ndef register_device(\n    *,\n    raw_code: str,\n'''
          validation_fn = """\ndef validate_device_registration(\n    *,\n    raw_code: str,\n    path: str,\n    device_id: str,\n    device_name: str,\n    public_key_base64: str,\n    timestamp: str,\n    nonce: str,\n    signature_base64: str,\n    signature_algorithm: str,\n) -> Dict[str, Any]:\n    safe_device_id = device_id.strip()[:128]\n    signed_device_name = device_name.strip().replace('\\n', ' ').replace('\\r', ' ')[:80]\n    if not safe_device_id or not signed_device_name:\n        raise DeviceAuthError('bad_request', 400)\n    _check_timestamp(timestamp)\n\n    canonical = _activation_canonical(\n        path=path,\n        raw_code=raw_code,\n        device_id=safe_device_id,\n        device_name=signed_device_name,\n        timestamp=timestamp,\n        nonce=nonce,\n    )\n    fingerprint = _verify_signature(\n        public_key_base64,\n        signature_base64,\n        canonical,\n        signature_algorithm,\n    )\n\n    con = _connect()\n    try:\n        activation = _activation_row(con, raw_code)\n        code = str(activation['code'])\n        limit, plan_title = _plan_limit_and_title(\n            str(activation['plan'] or ''),\n            int(activation['max_devices'] or 1),\n        )\n        existing = con.execute(\n            'SELECT id, public_key, public_key_fingerprint, active FROM code_devices WHERE code = ? AND device_id = ?',\n            (code, safe_device_id),\n        ).fetchone()\n        same_key_other_device = con.execute(\n            'SELECT device_id FROM code_devices WHERE code = ? AND public_key_fingerprint = ? AND device_id <> ?',\n            (code, fingerprint, safe_device_id),\n        ).fetchone()\n        if same_key_other_device:\n            raise DeviceAuthError('device_mismatch', 409)\n\n        already_registered = existing is not None\n        if existing:\n            if not bool(existing['active']):\n                raise DeviceAuthError('device_revoked', 403)\n            stored_public_key = str(existing['public_key'] or '').strip()\n            stored_fingerprint = str(existing['public_key_fingerprint'] or '').strip()\n            if stored_public_key:\n                try:\n                    _, decoded_fingerprint = _decode_public_key(stored_public_key)\n                except DeviceAuthError as exc:\n                    raise DeviceAuthError('device_key_binding_invalid', 409) from exc\n                expected_fingerprint = stored_fingerprint or decoded_fingerprint\n                if expected_fingerprint != fingerprint:\n                    raise DeviceAuthError('device_key_rotation_requires_reset', 409)\n\n        active_count = int(con.execute(\n            'SELECT COUNT(*) FROM code_devices WHERE code = ? AND active = 1',\n            (code,),\n        ).fetchone()[0])\n        if not already_registered and active_count >= limit:\n            raise DeviceAuthError('device_limit_reached', 409)\n\n        return {\n            'valid': True,\n            'code': code,\n            'already_registered': already_registered,\n            'plan_name': plan_title,\n            'plan_code': activation['plan'] or '',\n            'devices_used': active_count,\n            'devices_limit': limit,\n            'expires_at': activation['expires_at'],\n        }\n    finally:\n        con.close()\n\n\ndef register_device(\n    *,\n    raw_code: str,\n"""
          replace_once(device_auth_path, anchor, validation_fn)

          api_path = 'orchestrator/api.py'
          replace_once(
              api_path,
              '''    ensure_device_auth_storage,\n    register_device,\n)''',
              '''    ensure_device_auth_storage,\n    register_device,\n    validate_device_registration,\n)''',
          )
          activate_anchor = '''\n@app.post('/api/activate')\ndef activate(payload: ActivationRequest, request: Request):\n'''
          validate_endpoint = '''\n@app.post('/api/activate/validate')\ndef validate_activation(payload: ActivationRequest, request: Request):\n    if upgrade_required(payload.appVersionCode):\n        return upgrade_required_response()\n\n    if rate_limited(client_key(request, payload)):\n        return JSONResponse(status_code=429, content={'ok': False, 'reason': 'too_many_attempts'})\n\n    try:\n        header_device_id = _header(request, 'x-emery-device-id')\n        header_timestamp = _header(request, 'x-emery-timestamp')\n        header_nonce = _header(request, 'x-emery-nonce')\n        header_signature = _header(request, 'x-emery-signature')\n        header_algorithm = _header(request, 'x-emery-signature-algorithm')\n        _require_header_match(payload.deviceId, header_device_id)\n        _require_header_match(payload.timestamp, header_timestamp)\n        _require_header_match(payload.nonce, header_nonce)\n        _require_header_match(payload.signature, header_signature)\n        _require_header_match(payload.signature_algorithm, header_algorithm)\n\n        validation = validate_device_registration(\n            raw_code=payload.code,\n            path=request.url.path,\n            device_id=header_device_id,\n            device_name=payload.deviceName,\n            public_key_base64=payload.client_public_key,\n            timestamp=header_timestamp,\n            nonce=header_nonce,\n            signature_base64=header_signature,\n            signature_algorithm=header_algorithm,\n        )\n    except DeviceAuthError as error:\n        return _auth_error(error)\n\n    return {\n        'ok': True,\n        'code': validation.get('code') or payload.code.strip(),\n        'alreadyRegistered': validation.get('already_registered', False),\n        'plan': validation.get('plan_code'),\n        'planTitle': validation.get('plan_name'),\n        'usedDevices': validation.get('devices_used'),\n        'maxDevices': validation.get('devices_limit'),\n        'expiresAt': validation.get('expires_at'),\n    }\n\n\n@app.post('/api/activate')\ndef activate(payload: ActivationRequest, request: Request):\n'''
          replace_once(api_path, activate_anchor, validate_endpoint)

          client_path = 'app/src/main/java/com/v2ray/ang/ui/premium/SkryonActivationClient.kt'
          client_anchor = '''/**\n * One signed POST atomically reserves the tariff slot, records the device and returns\n * the VPN configuration. Existing production already enforces code/device counters;\n * the upgraded backend additionally verifies the Keystore signature and returns the\n * complete device inventory in the same response.\n */\ninternal suspend fun activateSkryonCode('''
          validate_client = '''internal suspend fun validateSkryonCode(\n    context: Context,\n    code: String,\n    formattedCode: String,\n): SkryonActivationResult = withContext(Dispatchers.IO) {\n    try {\n        val submittedCode = formattedCode.ifBlank { code.trim() }\n        val validationPath = "/api/activate/validate"\n        val proof = EmeryDeviceIdentity.buildActivationProof(\n            path = validationPath,\n            accessKey = submittedCode,\n        )\n        val requestJson = JSONObject()\n            .put("code", submittedCode)\n            .put("deviceId", proof.deviceId)\n            .put("deviceName", proof.deviceName)\n            .put("client_public_key", proof.publicKeyBase64)\n            .put("timestamp", proof.timestampMillis)\n            .put("nonce", proof.nonce)\n            .put("signature", proof.signatureBase64)\n            .put("signature_algorithm", proof.signatureAlgorithm)\n            .put("appVersionCode", BuildConfig.SKRYON_VERSION_CODE)\n            .toString()\n        val request = Request.Builder()\n            .url(SKRYON_WEBSITE_API_BASE_URL + validationPath)\n            .post(requestJson.toRequestBody("application/json; charset=utf-8".toMediaType()))\n            .header("Accept", "application/json")\n            .header("Connection", "close")\n            .header("X-Emery-Device-Id", proof.deviceId)\n            .header("X-Emery-Timestamp", proof.timestampMillis)\n            .header("X-Emery-Nonce", proof.nonce)\n            .header("X-Emery-Signature", proof.signatureBase64)\n            .header("X-Emery-Signature-Algorithm", proof.signatureAlgorithm)\n            .header(AppConfig.SKRYON_APP_VERSION_HEADER, BuildConfig.SKRYON_VERSION_CODE.toString())\n            .build()\n\n        val response = executeActivationRequest(request)\n        val json = runCatching { JSONObject(response.body) }.getOrNull()\n        if (response.code == 409) {\n            val reason = json?.serverReason().orEmpty().ifBlank { "device_limit_reached" }\n            return@withContext activationFailure(activationReasonText(reason), reason, response)\n        }\n        if (response.code == 429) {\n            return@withContext activationFailure(\n                "Слишком много попыток. Попробуйте позже",\n                "too_many_attempts",\n                response,\n            )\n        }\n        if (!response.successful || json == null) {\n            val reason = json?.serverReason().orEmpty().ifBlank {\n                if (response.code > 0) "activation_http_${response.code}" else "activation_response_invalid"\n            }\n            return@withContext activationFailure(\n                if (json == null || json.serverReason().isBlank()) {\n                    "Сервер активации недоступен"\n                } else {\n                    activationReasonText(reason)\n                },\n                reason,\n                response,\n            )\n        }\n        if (!json.optBoolean("ok", false)) {\n            val reason = json.serverReason().ifBlank { "activation_rejected" }\n            return@withContext activationFailure(\n                json.optString("message").ifBlank { activationReasonText(reason) },\n                reason,\n                response,\n            )\n        }\n\n        val confirmedCode = json.optString("code", submittedCode).trim().ifBlank { submittedCode }\n        if (normalizeActivationCode(confirmedCode) != normalizeActivationCode(submittedCode)) {\n            return@withContext activationFailure(\n                activationReasonText("activation_code_mismatch"),\n                "activation_code_mismatch",\n                response,\n            )\n        }\n        SkryonActivationResult(ok = true, code = confirmedCode)\n    } catch (_: IOException) {\n        activationFailure("Нет соединения с сервером", "network_io_error")\n    } catch (_: Exception) {\n        activationFailure("Ошибка проверки кода", "client_validation_exception")\n    }\n}\n\n/**\n * One signed POST atomically reserves the tariff slot, records the device and returns\n * the VPN configuration. Existing production already enforces code/device counters;\n * the upgraded backend additionally verifies the Keystore signature and returns the\n * complete device inventory in the same response.\n */\ninternal suspend fun activateSkryonCode('''
          replace_once(client_path, client_anchor, validate_client)

          activity_path = 'app/src/main/java/com/v2ray/ang/ui/premium/PremiumActivity.kt'
          replace_once(
              activity_path,
              '''    val navController = rememberNavController()\n    val context = LocalContext.current\n\n    Scaffold(''',
              '''    val navController = rememberNavController()\n    val context = LocalContext.current\n    var pendingActivationCode by remember { mutableStateOf("") }\n\n    Scaffold(''',
          )
          old_activation = '''            composable(EmeryRoute.Activation.name) {\n                ActivationScreen(\n                    onActivated = { code ->\n                        val formattedCode = formatSkryonActivationCode(code)\n                        val result = activateSkryonCode(context, code, formattedCode)\n                        if (result.ok) {\n                            val guid = saveActivatedSkryonConfig(result.config)\n                            MmkvManager.encodeSettings(SKRYON_ACTIVATION_CODE_PREF, result.code.ifBlank { formattedCode })\n                            MmkvManager.encodeSettings(SKRYON_ACTIVATION_CONFIG_PREF, result.config)\n                            MmkvManager.encodeSettings(SKRYON_SERVER_GUID_PREF, guid)\n                            MmkvManager.encodeSettings(SKRYON_SERVER_ID_PREF, result.serverId)\n                            MmkvManager.encodeSettings(SKRYON_CONFIG_REVISION_PREF, result.revision)\n                            MmkvManager.encodeSettings(AppConfig.PREF_REGIONAL_POLICY_MODE, "")\n                            MmkvManager.encodeSettings(AppConfig.PREF_REGIONAL_POLICY_PENDING, true)\n                            navController.navigate(EmeryRoute.RegionalPolicy.name) {\n                                popUpTo(EmeryRoute.Activation.name) { inclusive = true }\n                            }\n                        }\n                        result\n                    },\n                )\n            }\n            composable(EmeryRoute.RegionalPolicy.name) {\n                RegionalPolicyOnboardingScreen(\n                    initialMode = RegionalPolicyManager.readMode(),\n                    onContinue = { mode ->\n                        val result = RegionalPolicyManager.apply(context, mode)\n                        if (result.isSuccess) {\n                            MmkvManager.encodeSettings(AppConfig.PREF_REGIONAL_POLICY_PENDING, false)\n                            navController.navigate(EmeryRoute.Home.name) {\n                                popUpTo(EmeryRoute.RegionalPolicy.name) { inclusive = true }\n                            }\n                        }\n                        result\n                    },\n                )\n            }'''
          new_activation = '''            composable(EmeryRoute.Activation.name) {\n                ActivationScreen(\n                    onActivated = { code ->\n                        val formattedCode = formatSkryonActivationCode(code)\n                        val result = validateSkryonCode(context, code, formattedCode)\n                        if (result.ok) {\n                            pendingActivationCode = result.code.ifBlank { formattedCode }\n                            navController.navigate(EmeryRoute.RegionalPolicy.name) {\n                                popUpTo(EmeryRoute.Activation.name) { inclusive = true }\n                            }\n                        }\n                        result\n                    },\n                )\n            }\n            composable(EmeryRoute.RegionalPolicy.name) {\n                if (savedActivationCode().isBlank()) {\n                    PendingActivationCommitScreen(\n                        code = pendingActivationCode,\n                        onCommitted = { result, formattedCode ->\n                            val guid = saveActivatedSkryonConfig(result.config)\n                            MmkvManager.encodeSettings(\n                                SKRYON_ACTIVATION_CODE_PREF,\n                                result.code.ifBlank { formattedCode },\n                            )\n                            MmkvManager.encodeSettings(SKRYON_ACTIVATION_CONFIG_PREF, result.config)\n                            MmkvManager.encodeSettings(SKRYON_SERVER_GUID_PREF, guid)\n                            MmkvManager.encodeSettings(SKRYON_SERVER_ID_PREF, result.serverId)\n                            MmkvManager.encodeSettings(SKRYON_CONFIG_REVISION_PREF, result.revision)\n                            MmkvManager.encodeSettings(AppConfig.PREF_REGIONAL_POLICY_MODE, "")\n                            MmkvManager.encodeSettings(AppConfig.PREF_REGIONAL_POLICY_PENDING, true)\n                            pendingActivationCode = ""\n                        },\n                        onBack = {\n                            pendingActivationCode = ""\n                            navController.navigate(EmeryRoute.Activation.name) {\n                                popUpTo(EmeryRoute.RegionalPolicy.name) { inclusive = true }\n                            }\n                        },\n                    )\n                } else {\n                    RegionalPolicyOnboardingScreen(\n                        initialMode = RegionalPolicyManager.readMode(),\n                        onContinue = { mode ->\n                            val result = RegionalPolicyManager.apply(context, mode)\n                            if (result.isSuccess) {\n                                MmkvManager.encodeSettings(AppConfig.PREF_REGIONAL_POLICY_PENDING, false)\n                                navController.navigate(EmeryRoute.Home.name) {\n                                    popUpTo(EmeryRoute.RegionalPolicy.name) { inclusive = true }\n                                }\n                            }\n                            result\n                        },\n                    )\n                }\n            }'''
          replace_once(activity_path, old_activation, new_activation)

          screen_anchor = '''private fun regionalPolicyPending(): Boolean {\n    return MmkvManager.decodeSettingsBool(AppConfig.PREF_REGIONAL_POLICY_PENDING, false)\n}\n\n@Composable\nprivate fun RegionalPolicyOnboardingScreen('''
          screen_impl = '''private fun regionalPolicyPending(): Boolean {\n    return MmkvManager.decodeSettingsBool(AppConfig.PREF_REGIONAL_POLICY_PENDING, false)\n}\n\n@Composable\nprivate fun PendingActivationCommitScreen(\n    code: String,\n    onCommitted: (SkryonActivationResult, String) -> Unit,\n    onBack: () -> Unit,\n) {\n    val context = LocalContext.current\n    var error by remember(code) { mutableStateOf("") }\n    var working by remember(code) { mutableStateOf(true) }\n\n    LaunchedEffect(code) {\n        if (code.isBlank()) {\n            error = "Код активации не найден. Введите его ещё раз."\n            working = false\n            return@LaunchedEffect\n        }\n        val formattedCode = formatSkryonActivationCode(code)\n        val result = activateSkryonCode(context, code, formattedCode)\n        if (result.ok) {\n            onCommitted(result, formattedCode)\n        } else {\n            error = result.error.ifBlank { "Не удалось завершить активацию" }\n            working = false\n        }\n    }\n\n    Box(\n        modifier = Modifier\n            .fillMaxSize()\n            .background(Color.White)\n            .navigationBarsPadding()\n            .padding(horizontal = 28.dp),\n        contentAlignment = Alignment.Center,\n    ) {\n        Column(\n            modifier = Modifier.fillMaxWidth(),\n            horizontalAlignment = Alignment.CenterHorizontally,\n        ) {\n            Text(\n                text = "Настройка режима",\n                style = MaterialTheme.typography.headlineMedium,\n                color = Color(0xFF111319),\n                fontWeight = FontWeight.SemiBold,\n                textAlign = TextAlign.Center,\n            )\n            Spacer(Modifier.height(18.dp))\n            if (working) {\n                CircularProgressIndicator(\n                    modifier = Modifier.size(26.dp),\n                    strokeWidth = 2.dp,\n                    color = Color(0xFF111319),\n                )\n                Spacer(Modifier.height(14.dp))\n                Text(\n                    text = "Завершаем активацию…",\n                    style = MaterialTheme.typography.bodyMedium,\n                    color = Color(0xFF6F7580),\n                )\n            } else {\n                Text(\n                    text = error,\n                    style = MaterialTheme.typography.bodyMedium,\n                    color = Color(0xFFB42318),\n                    textAlign = TextAlign.Center,\n                )\n                Spacer(Modifier.height(18.dp))\n                Button(\n                    onClick = onBack,\n                    modifier = Modifier\n                        .fillMaxWidth()\n                        .height(56.dp),\n                    shape = RoundedCornerShape(18.dp),\n                    colors = ButtonDefaults.buttonColors(\n                        containerColor = Color(0xFF111319),\n                        contentColor = Color.White,\n                    ),\n                ) {\n                    Text("Вернуться к активации")\n                }\n            }\n        }\n    }\n}\n\n@Composable\nprivate fun RegionalPolicyOnboardingScreen('''
          replace_once(activity_path, screen_anchor, screen_impl)

          test_path = 'orchestrator/tests/test_activation_keys.py'
          helper_anchor = '''    def authenticate(self, *, code: str, device_id: str, private_key, path: str = '/profile'):\n'''
          helper = '''    def validate_registration(\n        self,\n        *,\n        code: str,\n        device_id: str,\n        private_key=None,\n        device_name: str = 'Test Android',\n    ):\n        key = private_key or self.new_private_key()\n        path = '/api/activate/validate'\n        nonce = uuid.uuid4().hex\n        timestamp = str(int(time.time() * 1000))\n        canonical = self.activation_canonical(\n            path=path,\n            raw_code=code,\n            device_id=device_id,\n            device_name=device_name,\n            timestamp=timestamp,\n            nonce=nonce,\n        )\n        return device_auth.validate_device_registration(\n            raw_code=code,\n            path=path,\n            device_id=device_id,\n            device_name=device_name,\n            public_key_base64=self.public_key_base64(key),\n            timestamp=timestamp,\n            nonce=nonce,\n            signature_base64=self.sign(key, canonical),\n            signature_algorithm='SHA256withECDSA',\n        )\n\n    def authenticate(self, *, code: str, device_id: str, private_key, path: str = '/profile'):\n'''
          replace_once(test_path, helper_anchor, helper)

          test_anchor = '''    def test_parallel_registration_cannot_exceed_limit(self) -> None:\n'''
          regression_test = '''    def test_validation_does_not_consume_slot_until_registration(self) -> None:\n        code = self.create_code('personal', 1)\n        first_key = self.new_private_key()\n        second_key = self.new_private_key()\n\n        first = self.validate_registration(\n            code=code,\n            device_id='validated-device-1',\n            private_key=first_key,\n        )\n        second = self.validate_registration(\n            code=code,\n            device_id='validated-device-2',\n            private_key=second_key,\n        )\n        self.assertEqual(0, first['devices_used'])\n        self.assertEqual(0, second['devices_used'])\n\n        with sqlite3.connect(self.db_path) as con:\n            registered = con.execute(\n                'SELECT COUNT(*) FROM code_devices WHERE code = ? AND active = 1',\n                (storage.format_code(code),),\n            ).fetchone()[0]\n            used_at = con.execute(\n                'SELECT used_at FROM activation_codes WHERE code = ?',\n                (storage.format_code(code),),\n            ).fetchone()[0]\n        self.assertEqual(0, registered)\n        self.assertIsNone(used_at)\n\n        self.register(\n            code=code,\n            device_id='validated-device-1',\n            private_key=first_key,\n        )\n        with self.assertRaises(device_auth.DeviceAuthError) as caught:\n            self.validate_registration(\n                code=code,\n                device_id='validated-device-2',\n                private_key=second_key,\n            )\n        self.assertEqual('device_limit_reached', caught.exception.reason)\n\n    def test_parallel_registration_cannot_exceed_limit(self) -> None:\n'''
          replace_once(test_path, test_anchor, regression_test)
          PY

      - name: Validate Python syntax
        run: python -m py_compile orchestrator/device_auth.py orchestrator/api.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orchestrator/device_auth.py orchestrator/api.py orchestrator/tests/test_activation_keys.py \
            app/src/main/java/com/v2ray/ang/ui/premium/SkryonActivationClient.kt \
            app/src/main/java/com/v2ray/ang/ui/premium/PremiumActivity.kt
          git commit -m "Delay activation slot consumption until policy screen"
          git push origin HEAD:feature/two-phase-activation
