name: Apply regional policy copy patch

on:
  push:
    branches:
      - ui-policy-copy-20260914
    paths:
      - '.github/workflows/ui-policy-copy-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ui-policy-copy-20260914

      - name: Update regional policy option copy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('app/src/main/java/com/v2ray/ang/ui/premium/PremiumActivity.kt'),
              Path('app/src/main/java/com/v2ray/ang/ui/premium/vpn/VpnMainScreen.kt'),
          ]

          replacements = {
              'description = "VPN используется за пределами Российской Федерации"':
                  'description = "Для использования за пределами Российской Федерации"',
              'description = "Для использования в РФ; ограниченные ресурсы блокируются"':
                  'description = "Для использования в Российской Федерации"',
          }

          for path in paths:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- app/src/main/java/com/v2ray/ang/ui/premium/PremiumActivity.kt app/src/main/java/com/v2ray/ang/ui/premium/vpn/VpnMainScreen.kt

      - name: Commit copy changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ui-policy-copy-patch.yml
          git add app/src/main/java/com/v2ray/ang/ui/premium/PremiumActivity.kt app/src/main/java/com/v2ray/ang/ui/premium/vpn/VpnMainScreen.kt
          git commit -m "UI: simplify regional policy option copy"
          git push origin HEAD:ui-policy-copy-20260914
