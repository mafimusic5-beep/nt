name: Activation key lifecycle tests

on:
  push:
    paths:
      - 'orchestrator/**'
      - '.github/workflows/activation-key-tests.yml'
  pull_request:
    paths:
      - 'orchestrator/**'
      - '.github/workflows/activation-key-tests.yml'

permissions:
  contents: read

jobs:
  activation-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt
      - name: Install orchestrator dependencies
        run: python -m pip install --quiet -r orchestrator/requirements.txt
      - name: Compile orchestrator
        run: python -m compileall -q orchestrator
      - name: Run activation key tests
        env:
          PYTHONPATH: orchestrator
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s orchestrator/tests -v 2>&1 | tee /tmp/activation-key-tests.log
      - name: Upload activation key test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activation-key-test-report
          path: /tmp/activation-key-tests.log
          if-no-files-found: error
          retention-days: 3
