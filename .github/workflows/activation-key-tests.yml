name: Activation key lifecycle tests

on:
  push:
    paths:
      - 'orchestrator/**'
      - '.github/workflows/activation-key-tests.yml'
  pull_request:
    paths:
      - 'orchestrator/**'
      - '.github/workflows/activation-key-tests.yml'

permissions:
  contents: read

jobs:
  activation-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt
      - name: Install orchestrator dependencies
        run: python -m pip install -r orchestrator/requirements.txt
      - name: Compile orchestrator
        run: python -m compileall -q orchestrator
      - name: Run activation key tests
        env:
          PYTHONPATH: orchestrator
        run: python -m unittest discover -s orchestrator/tests -v
