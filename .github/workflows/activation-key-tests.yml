name: Activation key lifecycle tests

on:
  push:
    paths:
      - 'orchestrator/**'
      - 'emery vpn orchestrator/**'
      - 'app/src/main/java/com/v2ray/ang/ui/premium/**'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/release/**'
      - 'app/src/debug/**'
      - 'app/src/main/res/xml/network_security_config.xml'
      - 'app/src/main/java/com/v2ray/ang/security/**'
      - 'app/src/main/java/com/v2ray/ang/service/V2RayVpnService.kt'
      - 'app/src/main/java/com/v2ray/ang/service/TProxyService.kt'
      - 'app/src/main/java/com/v2ray/ang/handler/MmkvManager.kt'
      - 'app/src/main/java/com/v2ray/ang/handler/EmeryAccessManager.kt'
      - 'app/src/main/java/com/v2ray/ang/handler/EmeryVpnSync.kt'
      - 'app/src/main/java/com/v2ray/ang/handler/EmeryApiConfig.kt'
      - 'app/src/main/java/com/v2ray/ang/handler/RegionalPolicyManager.kt'
      - 'app/src/main/java/com/v2ray/ang/network/EmeryAuthClient.kt'
      - 'app/src/main/java/com/v2ray/ang/network/EmeryBackendClient.kt'
      - 'app/src/main/java/com/v2ray/ang/network/EmeryPoolClient.kt'
      - 'app/src/main/java/com/v2ray/ang/ui/premium/SkryonActivationClient.kt'
      - '.github/workflows/activation-key-tests.yml'
  pull_request:
    paths:
      - 'orchestrator/**'
      - 'emery vpn orchestrator/**'
      - 'app/src/main/java/com/v2ray/ang/ui/premium/**'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/release/**'
      - 'app/src/debug/**'
      - 'app/src/main/res/xml/network_security_config.xml'
      - 'app/src/main/java/com/v2ray/ang/security/**'
      - 'app/src/main/java/com/v2ray/ang/service/V2RayVpnService.kt'
      - 'app/src/main/java/com/v2ray/ang/service/TProxyService.kt'
      - 'app/src/main/java/com/v2ray/ang/handler/MmkvManager.kt'
      - 'app/src/main/java/com/v2ray/ang/handler/EmeryAccessManager.kt'
      - 'app/src/main/java/com/v2ray/ang/handler/EmeryVpnSync.kt'
      - 'app/src/main/java/com/v2ray/ang/handler/EmeryApiConfig.kt'
      - 'app/src/main/java/com/v2ray/ang/handler/RegionalPolicyManager.kt'
      - 'app/src/main/java/com/v2ray/ang/network/EmeryAuthClient.kt'
      - 'app/src/main/java/com/v2ray/ang/network/EmeryBackendClient.kt'
      - 'app/src/main/java/com/v2ray/ang/network/EmeryPoolClient.kt'
      - 'app/src/main/java/com/v2ray/ang/ui/premium/SkryonActivationClient.kt'
      - '.github/workflows/activation-key-tests.yml'

permissions:
  contents: read

jobs:
  modern-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emery vpn orchestrator
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: emery vpn orchestrator/requirements.txt
      - name: Reject tracked environment secrets
        working-directory: ${{ github.workspace }}
        run: |
          if git ls-files | grep -Eq '(^|/)\.env$'; then
            echo 'Tracked .env files are forbidden.' >&2
            exit 1
          fi
      - name: Install backend dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q src tests alembic
      - name: Run backend tests
        run: python -m pytest -q
      - name: Verify migrations from an empty database
        env:
          DB_URL: sqlite:////tmp/emery-migrations.db
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

  activation-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt
      - name: Install orchestrator dependencies
        run: python -m pip install --quiet -r orchestrator/requirements.txt pytest==8.4.2
      - name: Compile orchestrator
        run: python -m compileall -q orchestrator
      - name: Run activation key tests
        env:
          PYTHONPATH: orchestrator
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q orchestrator/tests 2>&1 | tee /tmp/activation-key-tests.log
      - name: Upload activation key test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activation-key-test-report
          path: /tmp/activation-key-tests.log
          if-no-files-found: error
          retention-days: 3

  android-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Verify signed protocol version
        run: |
          grep -F 'val appVersionCode = 718' app/build.gradle.kts
          grep -F 'versionName = "2.0.18"' app/build.gradle.kts
      - name: Verify Skryon TLS pins
        run: |
          set -euo pipefail
          openssl s_client -connect skryon.ru:443 -servername skryon.ru -showcerts </dev/null 2>/dev/null > /tmp/skryon-chain.txt
          python3 - <<'PY'
          import base64
          import hashlib
          import pathlib
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          config_path = pathlib.Path('app/src/main/res/xml/network_security_config.xml')
          xml_text = config_path.read_text()
          root = ET.fromstring(xml_text)

          assert 'cleartextTrafficPermitted="false"' in xml_text
          assert 'src="user"' not in xml_text

          domains = {
              element.text.strip()
              for element in root.findall('.//domain')
              if element.text and element.text.strip()
          }
          assert 'skryon.ru' in domains

          pin_set = root.find('.//pin-set')
          assert pin_set is not None
          assert pin_set.attrib.get('expiration') == '2027-09-30'
          pins = {
              element.text.strip()
              for element in pin_set.findall('pin')
              if element.text and element.text.strip()
          }
          expected_pins = {
              'kIdp6NNEd8wsugYyyIYFsi1ylMCED3hZbSR8ZFsa/A4=',
              'mEflZT5enoR1FuXLgYYGqnVEoZvmf9c2bVBpiOjYQ0c=',
          }
          assert expected_pins <= pins
          assert len(pins) >= 2

          debug_text = pathlib.Path('app/src/debug/res/xml/network_security_config.xml').read_text()
          assert 'cleartextTrafficPermitted="true"' in debug_text
          assert 'src="user"' in debug_text

          api_config = pathlib.Path(
              'app/src/main/java/com/v2ray/ang/handler/EmeryApiConfig.kt'
          ).read_text()
          assert 'if (!BuildConfig.DEBUG) return DEFAULT_BASE_URL' in api_config
          assert 'private const val DEFAULT_BASE_URL = "https://skryon.ru"' in api_config

          chain_text = pathlib.Path('/tmp/skryon-chain.txt').read_text()
          certs = re.findall(
              r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----',
              chain_text,
              re.S,
          )
          if not certs:
              raise SystemExit('live skryon.ru certificate chain is empty')

          live_pins = set()
          for index, pem in enumerate(certs, start=1):
              cert_path = pathlib.Path(f'/tmp/skryon-cert-{index}.pem')
              cert_path.write_text(pem + '\n')
              pubkey = subprocess.check_output(
                  ['openssl', 'x509', '-in', str(cert_path), '-pubkey', '-noout']
              )
              der = subprocess.check_output(
                  ['openssl', 'pkey', '-pubin', '-outform', 'DER'],
                  input=pubkey,
              )
              live_pins.add(base64.b64encode(hashlib.sha256(der).digest()).decode())

          if not (pins & live_pins):
              raise SystemExit(
                  f'configured Skryon TLS pins do not match live chain: {sorted(live_pins)}'
              )

          print('Configured Skryon pins match the live TLS chain.')
          PY
      - name: Verify IPv6 leak protection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vpn = Path('app/src/main/java/com/v2ray/ang/service/V2RayVpnService.kt').read_text()
          hev = Path('app/src/main/java/com/v2ray/ang/service/TProxyService.kt').read_text()

          assert 'builder.addAddress(vpnConfig.ipv6Client, 126)' in vpn
          assert 'builder.addRoute("::", 0)' in vpn
          assert 'val captureIpv6' not in vpn
          assert 'appendLine("  ipv6: \'${vpnConfig.ipv6Client}\'")' in hev
          assert 'PREF_PREFER_IPV6' not in hev
          PY
      - name: Assemble Playstore debug
        run: ./gradlew :app:assemblePlaystoreDebug --no-daemon --stacktrace
      - name: Assemble hardened Playstore release
        run: ./gradlew :app:assemblePlaystoreRelease --no-daemon --stacktrace
