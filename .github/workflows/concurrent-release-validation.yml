name: Concurrent release validation

on:
  push:
    branches:
      - feature/concurrent-vpn-resource-allocation
    paths:
      - '.github/workflows/concurrent-release-validation.yml'
      - 'orchestrator/**'
      - 'emery vpn orchestrator/**'
      - 'app/**'

permissions:
  contents: read

jobs:
  modern-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emery vpn orchestrator
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: emery vpn orchestrator/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q src tests alembic
      - name: Run backend tests
        run: python -m pytest -q
      - name: Verify migrations
        env:
          DB_URL: sqlite:////tmp/emery-release-validation.db
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt
      - name: Install orchestrator dependencies
        run: python -m pip install --quiet -r orchestrator/requirements.txt pytest==8.4.2
      - name: Compile orchestrator
        run: python -m compileall -q orchestrator
      - name: Run orchestrator tests
        env:
          PYTHONPATH: orchestrator
        run: python -m pytest -q orchestrator/tests

  android-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Verify signed protocol version
        run: |
          grep -F 'val appVersionCode = 718' app/build.gradle.kts
          grep -F 'versionName = "2.0.18"' app/build.gradle.kts
      - name: Assemble Playstore debug
        run: ./gradlew :app:assemblePlaystoreDebug --no-daemon --stacktrace
