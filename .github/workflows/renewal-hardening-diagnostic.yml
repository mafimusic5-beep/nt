name: Renewal hardening diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/renewal-hardening-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure runner SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Inspect API to site SSH path
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          user="${VPS_USER:-root}"
          api_host=31.70.76.155
          api_port=8443
          ssh -4 -p "$api_port" -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new "$user@$api_host" 'bash -s' <<'REMOTE'
          set -u
          echo '=== API SSH FILE NAMES ==='
          if [ -d /root/.ssh ]; then
            find /root/.ssh -maxdepth 1 -type f -printf '%f mode=%m\n' | sort
          else
            echo 'NO_ROOT_SSH_DIR'
          fi

          echo '=== API SSH CONFIG HOSTS ==='
          if [ -f /root/.ssh/config ]; then
            awk 'tolower($1)=="host"{print $0} tolower($1)=="hostname"{print $0} tolower($1)=="port"{print $0} tolower($1)=="user"{print $0} tolower($1)=="identityfile"{print "IdentityFile <redacted-path>"}' /root/.ssh/config
          else
            echo 'NO_SSH_CONFIG'
          fi

          echo '=== TEST SITE ACCESS FROM API ==='
          site=157.22.206.113
          found=''
          for u in root ubuntu; do
            for p in 22 8443 2022 2222 2200 22222 8022; do
              if timeout 7 ssh -4 -p "$p" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$u@$site" 'test -f /var/www/skryon.ru/html/checkout.html' >/dev/null 2>&1; then
                echo "SITE_FROM_API_OK user=$u port=$p identity=default"
                found="$u:$p:default"
                break 2
              fi
              if [ -d /root/.ssh ]; then
                for k in /root/.ssh/*; do
                  [ -f "$k" ] || continue
                  case "$(basename "$k")" in
                    *.pub|known_hosts|known_hosts.old|config|authorized_keys) continue ;;
                  esac
                  if timeout 7 ssh -4 -p "$p" -i "$k" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$u@$site" 'test -f /var/www/skryon.ru/html/checkout.html' >/dev/null 2>&1; then
                    echo "SITE_FROM_API_OK user=$u port=$p identity=$(basename "$k")"
                    found="$u:$p:$(basename "$k")"
                    break 3
                  fi
                done
              fi
            done
          done
          if [ -z "$found" ]; then
            echo 'SITE_FROM_API_NOT_FOUND'
          fi
          REMOTE
