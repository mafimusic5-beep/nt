name: Skryon release backend preflight (read-only)

on:
  push:
    branches:
      - feature/skryon-telegram-releases-20261027
    paths:
      - '.github/workflows/skryon-release-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check configured server SSH route without modifying it
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          if [[ -z "${VPS_SSH_PRIVATE_KEY:-}" ]]; then
            echo 'No deploy SSH key configured in GitHub Actions'
            exit 2
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/skryon_preflight
          chmod 600 ~/.ssh/skryon_preflight
          ssh-keygen -y -f ~/.ssh/skryon_preflight >/dev/null
          all_hosts=("${VPS_HOST:-}" "31.70.76.155" "108.175.5.173" "82.146.49.10")
          all_ports=("${VPS_PORT:-}" 22 8443 2022 2222 2200 22222 8022)
          seen=" "
          for host in "${all_hosts[@]}"; do
            [[ -n "$host" ]] || continue
            host="${host#https://}"
            host="${host#http://}"
            host="${host%%/*}"
            host="${host%%:*}"
            for port in "${all_ports[@]}"; do
              [[ "$port" =~ ^[0-9]+$ ]] || continue
              key=" $host:$port "
              [[ "$seen" != *"$key"* ]] || continue
              seen+="$key"
              if ssh -4 -T -p "$port" -i ~/.ssh/skryon_preflight \
                  -o BatchMode=yes -o ConnectionAttempts=1 -o ConnectTimeout=3 \
                  -o StrictHostKeyChecking=accept-new -o NumberOfPasswordPrompts=0 \
                  "${VPS_USER:-root}@$host" "printf 'AUTHENTICATED\n'" >/dev/null 2>&1; then
                echo "Preflight SSH endpoint: $host:$port"
                ssh -4 -T -p "$port" -i ~/.ssh/skryon_preflight \
                  -o BatchMode=yes -o ConnectTimeout=7 -o StrictHostKeyChecking=yes \
                  "${VPS_USER:-root}@$host" 'bash -s' <<'REMOTE'
          set -eu
          printf 'REMOTE_HOST='; hostname
          printf 'BOT_STATE='; systemctl is-active skryon-bot.service || true
          printf 'API_STATE='; systemctl is-active skryon-api.service || true
          printf 'BOT_SOURCE='; if test -f /opt/nt/orchestrator/tg_admin.py; then echo yes; else echo no; fi
          printf 'SITE_ROOT='; if test -d /var/www/skryon.ru/html; then echo local; else echo remote; fi
          REMOTE
                exit 0
              fi
            done
          done
          echo 'No configured backend SSH endpoint accepted the deploy key.'
          exit 1
