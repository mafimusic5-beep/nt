name: Finalize Play release hardening

on:
  push:
    branches:
      - security/device-reinstall-hardening
    paths:
      - .github/workflows/release-hardening-apply.yml

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/device-reinstall-hardening
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install orchestrator test dependencies
        run: python -m pip install --quiet -r orchestrator/requirements.txt pytest==8.4.2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply release hardening patch
        run: python tools/finalize_play_release.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Compile orchestrator
        run: python -m compileall -q orchestrator

      - name: Run orchestrator security tests
        env:
          PYTHONPATH: orchestrator
        run: python -m pytest -q orchestrator/tests

      - name: Compile Android Play debug build
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePlaystoreDebug --no-daemon --stacktrace

      - name: Compile Android Play release bundle
        run: ./gradlew :app:bundlePlaystoreRelease --no-daemon --stacktrace

      - name: Commit verified release hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-hardening-apply.yml
          git rm .github/workflows/device-hardening-patch.yml
          git rm tools/finalize_play_release.py
          git add orchestrator/device_recovery_routes.py orchestrator/tests/test_device_recovery.py app/src/main/java/com/v2ray/ang/security/SkryonVpnDisclosure.kt app/src/main/java/com/v2ray/ang/ui/MainActivity.kt app/src/main/java/com/v2ray/ang/ui/premium/PremiumActivity.kt
          git diff --cached --check
          git commit -m 'Harden Play release device recovery and VPN disclosure'
          git push origin HEAD:security/device-reinstall-hardening
