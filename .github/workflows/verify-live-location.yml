name: Verify live location label

on:
  push:
    branches:
      - ops/targeted-location-deploy
    paths:
      - '.github/workflows/verify-live-location.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure deploy key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Verify live GeoIP label
        run: |
          set -euo pipefail
          ssh \
            -4 \
            -p 8443 \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=accept-new \
            root@31.70.76.155 <<'EOF'
          set -euo pipefail
          cd '/opt/nt/emery vpn orchestrator'
          PYTHONPATH=. /opt/nt/.runtime/modern/bin/python - <<'PY'
          import asyncio
          from src.bot.utils.geoip import detect_node_location
          from src.bot.handlers.server_setup import _auto_location_title

          async def main():
              location = await detect_node_location('217.154.243.155')
              title = _auto_location_title(location)
              print(f'LOCATION={location}')
              print(f'TITLE={title}')
              if title != '🇩🇪 Клеве':
                  raise SystemExit(f'unexpected title: {title!r}')

          asyncio.run(main())
          PY
          systemctl is-active --quiet emery-backend.service
          systemctl is-active --quiet skryon-bot.service
          EOF
