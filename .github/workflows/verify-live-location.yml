name: Verify live location label

on:
  push:
    branches:
      - ops/targeted-location-deploy
    paths:
      - '.github/workflows/verify-live-location.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure deploy key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Inspect all live GeoIP providers
        run: |
          set -euo pipefail
          ssh \
            -4 \
            -p 8443 \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=accept-new \
            root@31.70.76.155 <<'EOF'
          set -euo pipefail
          cd '/opt/nt/emery vpn orchestrator'
          PYTHONPATH=. /opt/nt/.runtime/modern/bin/python - <<'PY'
          import asyncio
          import httpx
          from src.bot.utils.geoip import _parse_ipapi, _parse_ipwho, _parse_ipinfo_is, detect_node_location
          from src.bot.handlers.server_setup import _auto_location_title

          IP = '217.154.243.155'

          async def main():
              providers = (
                  ('ipapi.co', f'https://ipapi.co/{IP}/json/', _parse_ipapi),
                  ('ipwho.is', f'https://ipwho.is/{IP}', _parse_ipwho),
                  ('ipinfo.is', f'https://ipinfo.is/{IP}', _parse_ipinfo_is),
              )
              async with httpx.AsyncClient(timeout=8.0, follow_redirects=True, headers={'User-Agent': 'Skryon-GeoIP/1.0'}) as http:
                  for name, url, parser in providers:
                      try:
                          response = await http.get(url)
                          response.raise_for_status()
                          payload = response.json()
                          parsed = parser(IP, payload)
                          print(f'{name}={parsed}')
                      except Exception as exc:
                          print(f'{name}=ERROR:{type(exc).__name__}:{exc}')
              location = await detect_node_location(IP)
              print(f'SELECTED={location}')
              print(f'TITLE={_auto_location_title(location)}')

          asyncio.run(main())
          PY
          systemctl is-active --quiet emery-backend.service
          systemctl is-active --quiet skryon-bot.service
          EOF
